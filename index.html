<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Observatoire loisirs</title>
<script>
/* thème : choix mémorisé, sinon celui du système (appliqué avant le rendu, pas de flash) */
try{const t=localStorage.getItem("obs_theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}
</script>
<style>
/* ═════════ jetons — palette dataviz validée (clair + sombre) ═════════ */
:root{
  color-scheme:light;
  --plane:#f4f4f1; --surface:#fcfcfb; --surface-2:#f0efeb; --raise:#ffffff;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#76746e;
  --grid:#e1e0d9; --axis:#c3c2b7; --hair:rgba(11,11,11,.10); --hair-2:rgba(11,11,11,.06);
  --accent:#2a78d6; --accent-ink:#1c5cab; --accent-soft:rgba(42,120,214,.10);
  /* comparaison : 4 premières teintes catégorielles, ordre fixe (validé : CVD ΔE ≥ 8,4) */
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
  --dim:#d3d2cb;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --warn-ink:#8a5a00; --crit:#d03b3b;
  /* séquentiel bleu : faible -> fort (le faible se fond dans la surface) */
  --q1:#cde2fb; --q2:#9ec5f4; --q3:#6da7ec; --q4:#3987e5; --q5:#256abf; --q6:#184f95;
  --shadow:0 1px 2px rgba(11,11,11,.04),0 6px 20px rgba(11,11,11,.04);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#141413; --raise:#222220;
    --ink:#f0efec; --ink-2:#c3c2b7; --muted:#8f8d87;
    --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,.10); --hair-2:rgba(255,255,255,.06);
    --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:rgba(57,135,229,.16);
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
    --dim:#3d3d3a;
    --good-ink:#0ca30c; --warn-ink:#fab219;
    --q1:#184f95; --q2:#256abf; --q3:#3987e5; --q4:#6da7ec; --q5:#9ec5f4; --q6:#cde2fb;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#141413; --raise:#222220;
  --ink:#f0efec; --ink-2:#c3c2b7; --muted:#8f8d87;
  --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,.10); --hair-2:rgba(255,255,255,.06);
  --accent:#3987e5; --accent-ink:#86b6ef; --accent-soft:rgba(57,135,229,.16);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --dim:#3d3d3a;
  --good-ink:#0ca30c; --warn-ink:#fab219;
  --q1:#184f95; --q2:#256abf; --q3:#3987e5; --q4:#6da7ec; --q5:#9ec5f4; --q6:#cde2fb;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--plane);color:var(--ink);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.01em}
a{color:var(--accent-ink);text-decoration:none}
a:hover{text-decoration:underline}
button,select,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}

/* ── accès ── */
#gate{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:var(--plane)}
#gate .box{background:var(--surface);border:1px solid var(--hair);padding:32px 34px;border-radius:18px;width:min(360px,92vw);box-shadow:var(--shadow)}
#gate h1{font-size:19px;margin-bottom:4px}
#gate p{color:var(--muted);font-size:13px;margin:0 0 22px}
#gate input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--hair);background:var(--surface-2);font-size:15px;margin-bottom:10px}
#gate button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#gate .err{color:var(--crit);font-size:13px;min-height:18px;margin-top:8px}

/* ── coque ── */
#app{display:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header{background:var(--surface);border-bottom:1px solid var(--hair);position:sticky;top:0;z-index:60}
.htop{display:flex;align-items:center;gap:16px;padding:12px 0 10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;white-space:nowrap}
.logo i{width:8px;height:8px;border-radius:50%;background:var(--good);flex:0 0 auto}
.univ{display:flex;background:var(--surface-2);border:1px solid var(--hair);border-radius:11px;padding:3px;gap:2px}
.univ button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.univ button.on{background:var(--raise);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
.ghost{background:none;border:1px solid var(--hair);color:var(--ink-2);padding:6px 10px;border-radius:9px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.ghost:hover{color:var(--ink);border-color:var(--axis)}
.icon{width:32px;height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center}
nav.sub{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.sub::-webkit-scrollbar{display:none}
nav.sub button{background:none;border:0;color:var(--ink-2);padding:9px 12px 11px;font-size:13.5px;font-weight:600;
  border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav.sub button:hover{color:var(--ink)}
nav.sub button.on{color:var(--ink);border-bottom-color:var(--accent)}

/* filtres : UNE rangée au-dessus de tout ce qu'elle cadre */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 0 4px}
.seg{display:flex;background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:2px}
.seg button{background:none;border:0;color:var(--ink-2);padding:7px 11px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink)}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;background:var(--surface);border:1px solid var(--hair);border-radius:10px;
  padding:8px 32px 8px 12px;font-size:13px;font-weight:600;cursor:pointer;max-width:260px}
.sel select.set{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.sel::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;border-right:1.5px solid var(--muted);
  border-bottom:1.5px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.fnote{color:var(--muted);font-size:12.5px;margin-left:auto}
.reset{background:none;border:0;color:var(--accent-ink);font-size:12.5px;font-weight:600;cursor:pointer;padding:6px 4px}

main{padding:10px 0 70px}
.scope{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 16px}
.scope h1{font-size:24px;line-height:1.2}
.scope .s{color:var(--ink-2);font-size:13.5px;margin-top:3px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}
.span2{grid-column:span 2}
.mt{margin-top:14px}
.grid>*,.card{min-width:0}

/* cartes */
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.ctitle{font-size:15px;font-weight:650}
.csub{color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.45}
.cact{display:flex;gap:6px;flex:0 0 auto}
.tbtn{background:none;border:1px solid var(--hair);color:var(--ink-2);border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.tbtn:hover{color:var(--ink);border-color:var(--axis)}
.tbtn.on{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.more{display:inline-block;margin-top:12px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--accent-ink);background:none;border:0;padding:0}

/* tuiles chiffres */
.tile{padding:16px 18px}
.tile .lab{color:var(--ink-2);font-size:12.5px;font-weight:600}
.tile .val{font-size:30px;line-height:1.1;margin:8px 0 6px;font-weight:650;letter-spacing:-.02em}
.tile .sub{color:var(--muted);font-size:12.5px;line-height:1.4}
.tile .vs{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.delta{font-weight:650;font-size:12px;padding:1px 6px;border-radius:6px}
.delta.up{color:var(--good-ink);background:rgba(12,163,12,.10)}
.delta.dn{color:var(--crit);background:rgba(208,59,59,.10)}
.delta.eq{color:var(--ink-2);background:var(--surface-2)}
.meter{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:10px;position:relative}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter b{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink-2);border-radius:1px}

/* barres horizontales (classements) */
.hb{display:flex;flex-direction:column;gap:2px}
.hbr{display:grid;grid-template-columns:minmax(110px,34%) 1fr 64px;gap:12px;align-items:center;padding:5px 6px;margin:0 -6px;border-radius:8px}
.hbr.click{cursor:pointer}
.hbr.click:hover{background:var(--surface-2)}
.hbr .l{min-width:0}
.hbr .l b{display:block;font-weight:550;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbr .l span{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbr .t{height:10px;background:var(--surface-2);border-radius:0 5px 5px 0;position:relative}
.hbr .t i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.hbr .t i.dim{background:var(--dim)}
.hbr .t em{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink-2);border-radius:1px}
.hbr .v{text-align:right;font-weight:650;font-size:13px;font-variant-numeric:tabular-nums}
.hbr.hl .l b{color:var(--accent-ink)}

/* colonnes (jour par jour) */
.cols{position:relative;height:170px;display:flex;align-items:flex-end;gap:2px;padding-left:44px;margin-top:6px}
.cols .gl{position:absolute;left:44px;right:0;border-top:1px solid var(--grid);pointer-events:none}
.cols .gl span{position:absolute;left:-44px;top:-8px;width:38px;text-align:right;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cols .c{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;cursor:default}
.cols .c:hover{background:var(--hair-2);border-radius:6px}
.cols .c i{display:block;width:min(24px,70%);background:var(--accent);border-radius:4px 4px 0 0;min-height:1px}
.cols .c i.dim{background:var(--dim)}
.cols .c i.we{opacity:1}
.cols .c em{position:absolute;left:12%;right:12%;border-top:2px solid var(--ink-2);pointer-events:none}
.xl{display:flex;gap:2px;padding-left:44px;margin-top:6px}
.xl span{flex:1;text-align:center;color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:visible;min-width:0}
.xl span.we{color:var(--ink-2);font-weight:600}
.leg{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;color:var(--ink-2);font-size:12px;align-items:center}
.leg .k{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.leg .ln{display:inline-block;width:14px;height:0;border-top:2px solid;margin-right:6px;vertical-align:3px}

/* lignes (comparaison) */
.lc{position:relative;height:220px;margin-left:44px}
.lc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lc .gl{position:absolute;left:0;right:0;border-top:1px solid var(--grid)}
.lc .gl span{position:absolute;left:-44px;top:-8px;width:38px;text-align:right;color:var(--muted);font-size:11px;white-space:nowrap}
.lc .hit{position:absolute;top:0;bottom:0;display:flex;left:0;right:0}
.lc .hit div{flex:1;position:relative}
.lc .hit div:hover::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid var(--axis)}

/* heatmap */
.hm{overflow-x:auto}
.hm table{border-collapse:separate;border-spacing:3px;width:100%;min-width:480px}
.hm th{color:var(--muted);font-size:11.5px;font-weight:600;padding:0 0 4px;text-align:center}
.hm th.rl{text-align:right;padding-right:8px;width:42px;white-space:nowrap}
.hm td{height:34px;border-radius:6px;text-align:center;font-size:11.5px;font-variant-numeric:tabular-nums;font-weight:600}
.hm td.nd{background:var(--surface-2);color:var(--muted);font-weight:400}
.scale{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.scale .sw{display:flex;gap:2px}
.scale .sw i{width:24px;height:9px;border-radius:2px;display:block}

/* tableaux (triables) */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -20px;padding:0 20px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:9px 10px;border-bottom:1px solid var(--hair-2);text-align:left;white-space:nowrap}
table.t th{color:var(--muted);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--surface);user-select:none}
table.t th.s{cursor:pointer}
table.t th.s:hover{color:var(--ink)}
table.t th.on{color:var(--ink)}
table.t th .ar{display:inline-block;width:10px;font-size:10px;margin-left:3px;color:var(--accent-ink)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t td.w{white-space:normal;min-width:180px}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:var(--surface-2)}
table.t tbody tr.hl td{background:var(--accent-soft)}
table.t tbody tr.hl td:first-child b{color:var(--accent-ink)}
table.t td .sm{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
table.t tfoot td{font-weight:650;border-top:1px solid var(--hair);border-bottom:0}
.cb{display:flex;align-items:center;gap:8px;min-width:120px}
.cb .bt{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:48px}
.cb .bt i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cb span{min-width:38px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--axis);display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;vertical-align:middle;background:var(--surface)}
.chk.on{border-color:transparent;color:#fff}
.chk.on::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.search{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:9px 12px;font-size:13.5px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

/* pastilles, badges */
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hair);border-radius:999px;padding:4px 10px;font-size:12.5px;
  color:var(--ink-2);background:var(--surface);white-space:nowrap}
.pill i{width:9px;height:9px;border-radius:50%;display:inline-block}
.pill button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 0 0 2px;font-size:14px;line-height:1}
.pill button:hover{color:var(--ink)}
.badge{display:inline-block;font-size:11px;font-weight:650;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);vertical-align:1px}
.badge.w{background:rgba(250,178,25,.16);color:var(--warn-ink)}
.badge.g{background:rgba(12,163,12,.12);color:var(--good-ink)}
.badge.a{background:var(--accent-soft);color:var(--accent-ink)}
.empty{color:var(--muted);text-align:center;padding:34px 10px;font-size:13.5px}
.center{text-align:center;color:var(--muted);padding:60px 0;font-size:14px}
.note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
.cmpbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ff{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px 22px}
.ff h4{font-size:12.5px;color:var(--ink-2);font-weight:650;margin-bottom:6px}
.ffr{display:grid;grid-template-columns:minmax(70px,38%) 1fr auto;gap:8px;align-items:center;padding:3px 0;font-size:12.5px}
.ffr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
.ffr .bt{height:8px;background:var(--surface-2);border-radius:0 4px 4px 0}
.ffr .bt i{display:block;height:100%;border-radius:0 4px 4px 0}
.ffr b{font-variant-numeric:tabular-nums;font-weight:650;min-width:52px;text-align:right}

/* petits multiples (historique) */
.sm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mini{border:1px solid var(--hair);border-radius:12px;padding:14px 16px;background:var(--surface);cursor:pointer}
.mini:hover{border-color:var(--axis)}
.mini .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mini .h b{font-size:13.5px}
.mini .k{display:flex;gap:16px;margin:6px 0 4px;color:var(--ink-2);font-size:12px;flex-wrap:wrap}
.mini .k strong{display:block;color:var(--ink);font-size:16px;font-weight:650}
.mini .cols{height:90px;padding-left:0}
.mini .xl{padding-left:0}

/* fiche détail */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:200;display:none}
#ov.on{display:block}
#sheet{position:absolute;right:0;top:0;bottom:0;width:min(720px,100%);overflow-y:auto;background:var(--plane);
  border-left:1px solid var(--hair);padding:0 22px calc(40px + env(safe-area-inset-bottom));box-shadow:-10px 0 40px rgba(0,0,0,.18)}
.sbar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--plane);padding:14px 0 10px;z-index:3;gap:8px}
.crumbs{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);min-width:0;overflow:hidden;white-space:nowrap}
.crumbs a{cursor:pointer}
.sh{margin:4px 0 16px}
.sh .kind{font-size:12px;font-weight:650;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.06em}
.sh h2{font-size:24px;margin-top:4px;line-height:1.2}
.sh .s{color:var(--ink-2);font-size:13.5px;margin-top:4px}
.sh .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sec{margin-top:22px}
.sec>h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;font-weight:650}
.kv{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:4px 14px}
.kv .r{display:flex;justify-content:space-between;gap:14px;padding:8px 0;font-size:13px;border-bottom:1px solid var(--hair-2)}
.kv .r:last-child{border:0}
.kv .r .k{color:var(--muted)}
.kv .r>span:last-child{text-align:right;word-break:break-word}
#sheet .card{box-shadow:none}
#sheet .tw{margin:0 -20px}

/* infobulle partagée */
#tip{position:fixed;z-index:400;pointer-events:none;background:var(--raise);border:1px solid var(--hair);border-radius:10px;padding:8px 11px;
  font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:none;max-width:260px}
#tip .v{font-weight:700;font-size:13.5px}

/* ═════════ accès ═════════ */

async function sha256(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(SALT+s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function check(){
  if(await sha256(document.getElementById("pw").value.trim().toLowerCase())===PW_HASH){
    sessionStorage.setItem(AUTH,PW_HASH);enter();

function logout(){sessionStorage.removeItem(AUTH);location.reload();}
function enter(){

/* ═════════ données ═════════ */
const API="https://nbvronwfvoksonatolcs.supabase.co/rest/v1";
const KEY="sb_publishable_5vFAbOG-hHH0s9mAoYmGyA_EG4bIQYj";
const H={apikey:KEY,Authorization:"Bearer "+KEY};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[<>&"']/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&#39;"}[c]));
const js=s=>esc(JSON.stringify(String(s??"")));       // argument de onclick="f(...)" sûr

/* villes stockées en MAJUSCULES sans accent : « SAINT-BARTHELEMY-D-ANJOU » -> « Saint-Barthelemy-d-Anjou » */
const PETITS=new Set(["de","d","la","le","les","en","sur","sous","aux","du","l"]);
const ville=s=>(s||"").toLowerCase().replace(/[a-zà-ÿ]+/g,(w,i)=>i>0&&PETITS.has(w)?w:w.charAt(0).toUpperCase()+w.slice(1));

/* Les horaires publiés sont en heure de Paris : « aujourd'hui » et « maintenant » aussi,

const PARIS=new Intl.DateTimeFormat("sv-SE",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",
  day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});      // -> "2026-09-25 16:10"

const ago=t=>{if(!t)return"—";const m=Math.round((Date.now()-new Date(t))/6e4);
  return m<2?"à l'instant":m<60?`il y a ${m} min`:m<1440?`il y a ${Math.round(m/60)} h`:`il y a ${Math.round(m/1440)} j`;};
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)];};

/* Supabase renvoie parfois une 500 passagère (délai dépassé sous charge, pendant un sync) :
   une seconde tentative suffit presque toujours. */
async function fetchR(url,opt){let r=await fetch(url,opt);
  if(r.status>=500){await new Promise(z=>setTimeout(z,900));r=await fetch(url,opt);}return r;}
async function q(p){const r=await fetchR(API+"/"+p,{headers:H});if(!r.ok)throw new Error("API "+r.status);return r.json();}
async function qPage(p,from){const r=await fetchR(API+"/"+p,{headers:{...H,Range:`${from}-${from+999}`}});
  if(r.status===416)return [];                 // page au-delà de la fin : vide, pas une erreur
  if(!r.ok)throw new Error("API "+r.status);return r.json();}
async function qCount(p){const r=await fetchR(API+"/"+p+"&limit=1",{headers:{...H,Prefer:"count=exact",Range:"0-0"}});
  const cr=r.headers.get("content-range");return cr&&cr.includes("/")?(+cr.split("/")[1]||0):null;}
async function qAll(p,maxPages=20){let out=[],f=0;for(;;){const b=await qPage(p,f);out=out.concat(b);
  if(b.length<1000||f>=(maxPages-1)*1000)break;f+=1000;}return out;}

let EN={},CE={},SA={},BY_ENS={},BY_CENTRE={},CENTRE_OF={},ENS_OF={},SESS=[],FRESH=null,map=null;
/* Parcs de loisirs enfants : mêmes tables, marqués salle.theme = "parc" et session.groupby = "parc".
   Tenus à l'écart de TOUTES les vues escape (sinon ils fausseraient occupation, ventes et carte). */
const NOPARC="&or=(groupby.is.null,groupby.neq.parc)";
let PEN={},PCE={},PSA={},PS=null,PS_LOADING=null;
/* Joueurs & panier RÉELS — sessions vendues à la place (non privées).
   places_vendues = baisse des places libres observée par le scraper depuis TRACK_START.
   On ne retient que les sessions suivies ≥ SUIVI_MIN jours avant leur date : une session
   découverte la veille a déjà vendu des places sans qu'on les voie (sous-comptage). */
const TRACK_START="2026-09-25", SUIVI_MIN=5, VENTES_MIN=20;
let VENTES=[], N_PRIVAT=0;
const ENS_MIN=5;               // échantillon minimal pour afficher une enseigne
function panierPour(grid,n){                 // prix_total = prix TOTAL par taille de groupe
  if(!grid||!n)return null;
  const ks=Object.keys(grid).map(Number).filter(k=>k>0&&grid[k]!=null);
  if(!ks.length)return null;
  if(grid[n]!=null)return +grid[n];
  const k=ks.reduce((a,b)=>Math.abs(b-n)<Math.abs(a-n)?b:a);
  return grid[k]/k*n;
}
const FIABLE=iso(new Date(new Date(TRACK_START+"T12:00").getTime()+(SUIVI_MIN+7)*864e5));
/* Deux garde-fous de justesse, calculés une fois après chargement :
   DAY_OK  : on écarte les jours de bord d'horizon (le scraper voit ~7 j, le
             dernier jour n'est que partiellement publié -> fausse occupation).
   PUBLIE  : une salle qui n'a JAMAIS eu un créneau libre ne se remplit pas à
             100 %, elle ne publie simplement pas ses dispos (fermée/bloquée).
             On la sort des taux d'occupation et on la compte à part. */
let DAY_OK=new Set(), PUBLIE=new Set(), N_NOPUB=0, MUET={};
function calibrate(){
  const byDay={};
  SESS.forEach(x=>byDay[x.date]=(byDay[x.date]||0)+1);
  const counts=Object.values(byDay).sort((a,b)=>a-b);
  const med=counts.length?counts[Math.floor(counts.length/2)]:0;
  DAY_OK=new Set(Object.keys(byDay).filter(d=>byDay[d]>=med*0.3));
  const st={};
  SESS.forEach(x=>{if(!DAY_OK.has(x.date)||x.statut==="retire")return;
    const s=st[x.salle_id]=st[x.salle_id]||{n:0,libre:0,booked:0,prix:0};
    s.n++;if(x.dispo)s.libre++;else if(x.booked)s.booked++;if(x.prix_total_moyen)s.prix++;});
  PUBLIE=new Set(Object.keys(st).filter(k=>st[k].libre>0));
  /* Salle « muette » = pas un seul créneau libre observé. On distingue la cause :
       - tous les créneaux explicitement réservés  -> complet / fermé sur la période
       - aucun prix publié (API dégradée côté enseigne) -> dispo non publiée */
  MUET={};
  Object.entries(st).forEach(([id,s])=>{
    if(s.libre>0)return;
    MUET[id]={...s, raison: s.booked>=s.n*0.8 ? "complet" : s.prix===0 ? "non-publiee" : "fermee"};
  });
  N_NOPUB=Object.keys(MUET).length;
}
const MUET_LIB={complet:"complet sur la période","non-publiee":"disponibilités non publiées",fermee:"salle fermée / bloquée"};

async function boot(){
  lireHash();
  /* compte indisponible (500 passagère) : on lit 30 pages, les pages vides au-delà de la fin
     reviennent vides au lieu de faire échouer tout le chargement */
  const nSess=await qCount(`sessions?select=salle_id&date=gte.${TODAY}${NOPARC}`).catch(()=>null);
  const pages=nSess==null?30:Math.min(Math.ceil(nSess/1000),40);
  const sel=`sessions?select=salle_id,date,heure,dispo,booked,prive,statut,prix_total_moyen&date=gte.${TODAY}${NOPARC}&order=date,heure`;
  const D30=iso(new Date(Date.now()-30*864e5));
  const selV=`sessions?select=salle_id,date,premier_vu,places_vendues,places_max,booked,prix_total&prive=is.false&places_vendues=gt.0&date=gte.${D30}&date=lt.${TODAY}${NOPARC}&order=date`;
  const [ens,cent,sal,fresh,ventes,...chunks]=await Promise.all([
    q("enseignes?select=id,nom,website&order=nom"),
    q("centres?select=id,nom,ville,cp,adresse,lat,lon,enseigne_id"),
    q("salles?select=id,nom,theme,duree_minutes,joueurs_min,joueurs_max,difficulty,centre_id"),
    /* fraîcheur : bornée aux sessions à venir (index sur date) */
    q(`sessions?select=dernier_vu&date=gte.${TODAY}&order=dernier_vu.desc&limit=1`).catch(()=>[]),
    qAll(selV).catch(()=>[]),                 // ne doit jamais bloquer le dashboard
    ...Array.from({length:pages},(_,i)=>qPage(sel,i*1000))
  ]);
  const centParc=new Set(sal.filter(s=>s.theme==="parc").map(s=>s.centre_id));
  const ensEsc=new Set(cent.filter(c=>!centParc.has(c.id)).map(c=>c.enseigne_id));
  ens.forEach(e=>{if(ensEsc.has(e.id)||!cent.some(c=>c.enseigne_id===e.id))EN[e.id]=e;else PEN[e.id]=e;});
  cent.forEach(c=>{if(centParc.has(c.id)){PCE[c.id]=c;return;}
    CE[c.id]=c;(BY_ENS[c.enseigne_id]=BY_ENS[c.enseigne_id]||[]).push(c);});
  sal.forEach(s=>{if(s.theme==="parc"){PSA[s.id]=s;return;}
    SA[s.id]=s;(BY_CENTRE[s.centre_id]=BY_CENTRE[s.centre_id]||[]).push(s);
    const c=CE[s.centre_id];CENTRE_OF[s.id]=c;if(c)ENS_OF[s.id]=c.enseigne_id;});
  SESS=chunks.flat();
  const suivies=ventes.filter(v=>{           // suivie assez tôt avant sa date ?
    const debut=v.premier_vu&&v.premier_vu.slice(0,10)>TRACK_START?v.premier_vu.slice(0,10):TRACK_START;
    return dayDiff(v.date,debut)>=SUIVI_MIN;});
  /* Session réservée qui passe d'un coup à 0 place = presque toujours une PRIVATISATION
     (un groupe prend tout) : le nombre de joueurs est inconnu, pas « 24 ». Écartée. */
  const priv=v=>v.booked&&v.places_max&&v.places_vendues>=v.places_max;
  VENTES=suivies.filter(v=>!priv(v)); N_PRIVAT=suivies.length-VENTES.length;
  calibrate();
  FRESH=fresh[0]&&fresh[0].dernier_vu;
  $("#fresh").textContent="relevé "+ago(FRESH);
  if(S.u==="parcs")await chargerParcs();
  render();
  if(FICHE.length){const f=FICHE.pop();openFiche(f.t,f.id);}
}

const ZONES_FIXES=[["zone:idf","Île-de-France"],["zone:Paris","Paris"],["zone:Petite couronne","Petite couronne (92·93·94)"],

/* ═════════ découpage : période × marque × zone (une rangée de filtres cadre TOUT) ═════════ */
function periode(per){
  const now=new Date(),end=new Date();let from=TODAY,to=null,hFrom=null;
  if(per==="7"){end.setDate(now.getDate()+7);to=iso(end);}
  else if(per==="soir"){to=TODAY;hFrom=17;}
  else if(per==="we"){const d=now.getDay(),add=(6-d+7)%7;const s=new Date();s.setDate(now.getDate()+add);
    const e=new Date(s);e.setDate(s.getDate()+1);from=iso(s);to=iso(e);}
  return {from,to,hFrom};
}
const nowHM=()=>PARIS.format(new Date()).slice(11,16);
/* o.m / o.z : "" = toutes les marques / toute la zone ; undefined = filtre courant */
function rowsE(o={}){
  const m=o.m!==undefined?o.m:S.m,z=o.z!==undefined?o.z:S.z,{from,to,hFrom}=periode(o.p||S.p),hm=nowHM();
  return SESS.filter(x=>{
    if(!DAY_OK.has(x.date)||x.statut==="retire")return false;   // bord d'horizon / retiré par l'enseigne
    if(x.date===TODAY&&x.heure<hm)return false;                  // déjà passé : plus réservable, pas « occupé »
    if(x.date<from||(to&&x.date>to))return false;
    if(hFrom!=null&&+x.heure.slice(0,2)<hFrom)return false;
    if(m&&ENS_OF[x.salle_id]!==m)return false;
    if(z){const c=CENTRE_OF[x.salle_id];if(!c||!inZone(c,z))return false;}
    return true;});
}
function rowsP(o={}){
  const m=o.m!==undefined?o.m:S.m,z=o.z!==undefined?o.z:S.z,hm=nowHM();
  let {from,to,hFrom}=periode(o.p||S.p);
  if(o.passe){from=iso(new Date(Date.now()-14*864e5));to=iso(new Date(Date.now()-864e5));hFrom=null;}
  return (PS||[]).filter(x=>{
    if(x.statut==="retire"||!x.places_init)return false;
    if(!o.passe&&x.date===TODAY&&x.heure<hm)return false;

function histJours(h){
  const J=Object.entries(h.jours||{}).sort((a,b)=>a[0].localeCompare(b[0]));

    const o=w[k]=w[k]||{e:0,j:0,ca:0,a:0,n:0,jours:0};o.e+=v.e||0;o.j+=v.j||0;o.ca+=v.ca||0;o.a+=v.a||0;o.n+=v.n||0;o.jours++;});
  return Object.entries(w).sort((a,b)=>a[0].localeCompare(b[0]));
}

/* lignes de comparaison : une couleur par marque, ordre fixe ; repère vertical au survol */

/* heatmap jour × heure : une teinte, du faible (se fond dans la surface) au fort */

const TIP=$("#tip");let tipEl=null;
function showTip(el,e){
  let d;try{d=JSON.parse(el.dataset.tip);}catch(_){return;}

  if(Array.isArray(d)){add("m",d[0]);if(d[1])add("v",d[1]);if(d[2])add("m",d[2]);}

  if(el){if(el!==tipEl)showTip(el,e);}else if(tipEl)hideTip();});

/* niveau géographique pertinent : le plus large qui distingue encore plusieurs zones */
function nivAuto(rows){
  const u=U(),seen={zone:new Set(),reg:new Set(),dep:new Set()};
  for(const x of rows){const c=u.centre(x);if(!c)continue;const g=geo(c);seen.zone.add(g.zone);seen.reg.add(g.reg);seen.dep.add(g.dep);}
  if(S.u==="parcs"&&seen.reg.size>1)return "reg";
  if(S.u==="escape"&&seen.zone.size>1)return "zone";
  return seen.dep.size>1?"dep":"ville";
}
/* valeur du filtre « zone » correspondant à une ligne d'un niveau géographique */
function filtreDe(niv,k){
  if(niv==="zone")return ["Paris","Petite couronne","Grande couronne"].includes(k)?"zone:"+k:"r:"+k;
  if(niv==="reg")return k==="Île-de-France"?"zone:idf":"r:"+k;
  if(niv==="dep"){const m=k.match(/\(([0-9AB]{2})\)$/);return m?"d:"+m[1]:"";}
  return "v:"+k;
}
function ventesStats(m=S.m,z=S.z){
  const rows=VENTES.filter(v=>{const c=CENTRE_OF[v.salle_id];if(!c)return false;
    if(m&&ENS_OF[v.salle_id]!==m)return false;return !z||inZone(c,z);});
  const parEns={};
  rows.forEach(v=>{const eid=ENS_OF[v.salle_id];if(!eid)return;
    const e=parEns[eid]=parEns[eid]||{j:[],p:[],pj:[]};e.j.push(v.places_vendues);
    const pa=panierPour(v.prix_total,v.places_vendues);if(pa){e.p.push(pa);e.pj.push(pa/v.places_vendues);}});
  const J=rows.map(v=>v.places_vendues),P=rows.map(v=>panierPour(v.prix_total,v.places_vendues)).filter(Boolean);
  return {n:rows.length,jMed:median(J),pMed:median(P),parEns,nEns:Object.keys(parEns).length};
}
function carteVentes(){
  const V=ventesStats(),sub=`Sessions vendues à la place : on suit la baisse des places libres jusqu'au jour J. Sessions des 30 derniers jours, suivies au moins ${SUIVI_MIN} jours avant. Médianes.`;
  if(V.n<VENTES_MIN)return card({title:"Joueurs et panier réels",sub,body:`<div class="empty">Collecte en cours depuis le ${frDate(TRACK_START)} — ${plur(V.n,"session mesurée","sessions mesurées")}.<br>Premiers chiffres fiables vers le <b>${frDate(FIABLE)}</b>.</div>`});

function cartePrixDemande(gm){
  const pts=Object.entries(gm).map(([id,o])=>({id,nom:nomM(id),t:occ(o),p:median(o.prix),n:o.n})).filter(p=>p.p&&p.n>=12);
  if(pts.length<3)return card({title:"Prix et demande",sub:"Prix médian d'une session face au taux d'occupation.",body:`<div class="empty">Pas assez de marques avec des prix publiés sur ce filtre.</div>`});
  const W=560,Hh=280,P={l:46,r:18,t:16,b:36};
  const xs=pts.map(p=>p.p),xmin=Math.min(...xs)*.92,xmax=Math.max(...xs)*1.06;
  const X=v=>P.l+(v-xmin)/(xmax-xmin)*(W-P.l-P.r),Y=v=>Hh-P.b-(v/100)*(Hh-P.t-P.b);
  const gy=[0,25,50,75,100],gx=[0,.25,.5,.75,1].map(f=>Math.round(xmin+f*(xmax-xmin)));
  const hl=S.m?pts.find(p=>p.id===S.m):null;
  const lab=[hl||[...pts].sort((a,b)=>b.t-a.t)[0],!hl&&[...pts].sort((a,b)=>b.p-a.p)[0]].filter((v,i,a)=>v&&a.indexOf(v)===i);
  const svg=`<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Prix médian par session contre taux d'occupation, une marque par point" style="display:block;max-height:320px">
    ${gy.map(g=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--grid)"/><text x="${P.l-8}" y="${Y(g)+4}" fill="var(--muted)" font-size="11" text-anchor="end">${g} %</text>`).join("")}
    ${gx.map(g=>`<text x="${X(g)}" y="${Hh-12}" fill="var(--muted)" font-size="11" text-anchor="middle">${g} €</text>`).join("")}
    ${pts.filter(p=>p!==hl).map(p=>`<g style="cursor:pointer" onclick="openFiche('marque',${js(p.id)})"${tipAttr([p.nom,`${pctTxt(p.t)} occupé · ${eur(p.p)}`,`${nf(p.n)} créneaux`])}>
      <circle cx="${X(p.p)}" cy="${Y(p.t)}" r="12" fill="transparent"/><circle cx="${X(p.p)}" cy="${Y(p.t)}" r="5" fill="${hl?"var(--dim)":"var(--accent)"}" stroke="var(--surface)" stroke-width="2"/></g>`).join("")}
    ${hl?`<circle cx="${X(hl.p)}" cy="${Y(hl.t)}" r="7" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"${tipAttr([hl.nom,`${pctTxt(hl.t)} occupé · ${eur(hl.p)}`])}/>`:""}
    ${lab.map(p=>{const x=X(p.p),right=x>W*.62;return `<text x="${right?x-11:x+11}" y="${Math.max(14,Y(p.t)+4)}" text-anchor="${right?"end":"start"}" fill="var(--ink-2)" font-size="12" font-weight="600">${esc(p.nom.length>20?p.nom.slice(0,19)+"…":p.nom)}</text>`;}).join("")}</svg>`;
  return card({title:"Prix et demande",sub:"Une marque par point : prix médian d'une session (horizontal) et occupation (vertical). En haut à droite : cher et très demandé.",
    body:svg,key:"pd",table:tbl("pd",[{k:"nom",lab:"Marque"},{k:"p",lab:"Prix médian",n:1,fmt:eur},{k:"t",lab:"Occupation",n:1,fmt:pctTxt}],pts,{click:r=>`openFiche('marque',${js(r.id)})`})});
}

function blocComparaison(ids){

function dessinerCarte(){
  if(typeof L==="undefined"){$("#map").innerHTML='<div class="center">Carte indisponible (librairie non chargée).</div>';return;}
  const u=U(),esc_=S.u==="escape",g=u.grp(u.rows(),x=>{const c=u.centre(x);return c&&c.id;});
  const cs=u.centres().filter(c=>c.lat&&c.lon&&(!S.m||c.enseigne_id===S.m)&&inZone(c,S.z));
  const dark=getComputedStyle(document.documentElement).colorScheme==="dark";
  map=L.map("map",{scrollWheelZoom:false});
  /* fond neutre sans clé (les fonds CARTO exigent désormais une clé d'API) */
  L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${dark?"Dark":"Light"}_Gray_Base/MapServer/tile/{z}/{y}/{x}`,
    {attribution:"Fond © Esri — HERE, Garmin, © OpenStreetMap",maxZoom:16}).addTo(map);
  const cssv=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const maxN=Math.max(1,...cs.map(c=>(g[c.id]||{}).n||0)),pts=[];
  cs.forEach(c=>{const o=g[c.id],t=o?u.taux(o):null,i=t==null?0:Math.min(5,Math.floor(t/100*6));
    const r=5+9*Math.sqrt(((o||{}).n||0)/maxN);
    const m=L.circleMarker([c.lat,c.lon],{radius:r,color:cssv("--surface"),weight:1.5,fillColor:t==null?cssv("--dim"):cssv(`--q${i+1}`),fillOpacity:.95}).addTo(map);
    const nomL=esc_?(c.nom||nomM(c.enseigne_id)):c.nom;
    m.bindPopup(`<b>${esc(nomL)}</b><br><span style="color:var(--muted)">${esc(nomM(c.enseigne_id))} · ${esc(geo(c).ville)}</span><br>
      ${t==null?"pas de relevé sur ce filtre":`${u.tauxLab} <b>${t} %</b>${esc_?"":` · ${eurK(o.ca)} réservés`}`}<br>
      <a href="#" onclick="map.closePopup();openFiche('${esc_?"marque":"parc"}',${js(esc_?c.enseigne_id:c.id)});return false">Ouvrir la fiche →</a>`);
    pts.push([c.lat,c.lon]);});
  if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:13});else map.setView([48.857,2.352],10);
}

  return scope("Historique réel",`${esc(S.m?nomM(S.m)+" · ":"")}${esc(zoneLab(S.z))} · ${plur(ps.length,"parc")} sur ROLLER`)+

function societesFiltrees(){
  return ((COMPTES||{}).societes||[]).filter(x=>Object.keys(x.finances||{}).length||(x.centres||[]).length).map(x=>{
    const cs=(x.centres||[]).filter(c=>PCE[c]),ex=exo(x.finances),dern=ex.find(([,v])=>v.ca||v.resultat_net!=null)||ex[0]||["",{}],prec=ex[ex.indexOf(dern)+1]||["",{}];
    return {...x,cs,ex,k0:dern[0],ca:dern[1].ca||null,rn:dern[1].resultat_net??null,k1:prec[0],ca1:prec[1].ca||null,rn1:prec[1].resultat_net??null,
      marques:new Set(cs.map(c=>PCE[c].enseigne_id))};
  }).filter(x=>(!S.m||x.marques.has(S.m)||(x.groupe||"").toLowerCase().includes(nomM(S.m).toLowerCase()))
    &&(!S.z||x.cs.some(c=>inZone(PCE[c],S.z))));
}

/* ═════════ fiches détail (panneau latéral, pile avec retour) ═════════ */
let FICHE_VUE="";
function openFiche(t,id){FICHE.push({t,id});renderFiche();ecrireHash();}
function closeFiche(silent){FICHE=[];FICHE_VUE="";$("#ov").classList.remove("on");hideTip();if(!silent)ecrireHash();}
function retourFiche(i){FICHE=FICHE.slice(0,i+1);renderFiche();ecrireHash();}
function titreFiche(f){
  return f.t==="marque"?nomM(f.id):f.t==="parc"?(PCE[f.id]||{}).nom||"Parc":f.t==="salle"?(SA[f.id]||{}).nom||"Salle"
    :f.t==="zone"?f.id.slice(f.id.indexOf("|")+1):"Méthodologie";
}
async function renderFiche(){
  const f=FICHE[FICHE.length-1];if(!f){closeFiche(true);return;}
  if(f.t==="parc"||(f.t==="marque"&&PEN[f.id])||(f.t==="zone"&&S.u==="parcs"))await chargerParcs().catch(()=>{});
  const crumbs=FICHE.slice(0,-1).map((x,i)=>`<a onclick="retourFiche(${i})">${esc(titreFiche(x))}</a> ›`).join(" ");
  const bar=`<div class="sbar"><div class="crumbs">${FICHE.length>1?`<button class="ghost" onclick="retourFiche(${FICHE.length-2})">‹ Retour</button><span>${crumbs}</span>`:""}</div>
    <button class="ghost" onclick="closeFiche()">✕ Fermer</button></div>`;
  let body;
  try{body={marque:ficheMarque,parc:ficheParc,salle:ficheSalle,zone:ficheZone,methodo:ficheMethodo}[f.t](f.id);}
  catch(e){body=`<div class="empty">Fiche indisponible (${esc(e.message)}).</div>`;}
  const sh=$("#sheet"),cle=f.t+":"+f.id,top=sh.scrollTop;
  sh.innerHTML=bar+body;$("#ov").classList.add("on");
  sh.scrollTop=cle===FICHE_VUE?top:0;FICHE_VUE=cle;
  if(f.t==="salle")releveSalle(f.id);
  if(f.t==="marque"&&!PEN[f.id])releveMarque(f.id);
}
function ficheTete(kind,titre,sous,acts){
  return `<div class="sh"><div class="kind">${kind}</div><h2>${esc(titre)}</h2>${sous?`<div class="s">${sous}</div>`:""}${acts?`<div class="acts">${acts}</div>`:""}</div>`;
}
const sec=(t,h)=>h?`<div class="sec"><h3>${t}</h3>${h}</div>`:"";
const kv=rows=>`<div class="kv">${rows.filter(Boolean).map(([k,v])=>`<div class="r"><span class="k">${k}</span><span>${v}</span></div>`).join("")}</div>`;
const lien=u=>u?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\//,"").replace(/\/$/,""))} ↗</a>`:"—";
function filtrerMarque(id){const u=PEN[id]?"parcs":"escape";
  if(u!==S.u){S.u=u;S.cmp=[];NIV=null;if(!PERIODES[u].some(x=>x[0]===S.p))S.p="7";}
  S.m=id;S.v="synthese";closeFiche(true);window.scrollTo(0,0);render();}
function comparerMarque(id){const u=PEN[id]?"parcs":"escape";
  if(u!==S.u){S.u=u;S.cmp=[];S.m="";NIV=null;if(!PERIODES[u].some(x=>x[0]===S.p))S.p="7";}
  if(!S.cmp.includes(id)){const j=S.cmp.findIndex(x=>!x);if(j>=0)S.cmp[j]=id;else if(S.cmp.length<4)S.cmp.push(id);}
  S.v="marques";closeFiche(true);window.scrollTo(0,0);render();}
/* colonnes jour par jour d'une entité, avec un repère (marché, marque…) */
function joursAvec(u,rows,ref,refLab,titreLab){
  const gd=u.grp(rows,x=>x.date),gr=ref?u.grp(ref,x=>x.date):null,ds=Object.keys(gd).sort();
  if(!ds.length)return "";
  const mx=pctMax(Math.max(...ds.map(d=>Math.max(u.taux(gd[d])||0,gr&&gr[d]?u.taux(gr[d]):0))));
  return cols(ds.map(d=>{const o=gd[d],r=gr&&gr[d];return {k:d,v:u.taux(o),mark:r?u.taux(r):null,
      tip:[dlong(d),pctTxt(u.taux(o))+(r?` · ${refLab} ${pctTxt(u.taux(r))}`:""),S.u==="escape"||!o.ca&&o.ca!==0?`${nf(o.n)} créneaux · ${nf(o.libres)} libres`:`${nf(o.vend)} places · ${eurK(o.ca)} · ${o.complets} complets`]};}),{max:mx})+
    (ref?`<div class="leg"><span><i class="k" style="background:var(--accent)"></i>${esc(titreLab)}</span><span><i class="ln" style="border-color:var(--ink-2)"></i>${esc(refLab)}</span></div>`:"");
}
function heuresDe(u,rows,esc_){
  const BK=esc_?[[0,12,"–12h"],[12,14,"12-14"],[14,16,"14-16"],[16,18,"16-18"],[18,20,"18-20"],[20,22,"20-22"],[22,24,"22h+"]]
    :[[0,10,"–10h"],[10,11,"10h"],[11,12,"11h"],[12,13,"12h"],[13,14,"13h"],[14,15,"14h"],[15,16,"15h"],[16,17,"16h"],[17,24,"17h+"]];
  const gh=u.grp(rows,x=>{const jd=(new Date(x.date+"T12:00").getDay()+6)%7,h=+x.heure.slice(0,2),b=BK.findIndex(k=>h>=k[0]&&h<k[1]);return b<0?null:jd+"|"+b;});
  const cells={};Object.entries(gh).forEach(([k,o])=>{if(o.n>=2)cells[k]={v:u.taux(o),m:`${nf(o.n)} créneaux`};});
  return heat(cells,BK.map(b=>b[2]),{lab:u.tauxLab,vide:"fermé ou trop peu de créneaux"});
}

/* ── fiche marque ── */
function ficheMarque(id){
  const isP=!!PEN[id],u=isP?UNIV.parcs:UNIV.escape,e=(isP?PEN:EN)[id]||{nom:id};
  const rows=u.rows({m:id,z:""}),T=u.tot(rows),ref=u.rows({m:"",z:""}),mk=u.tot(ref);
  const t=u.taux(T),tm=u.taux(mk);
  const centres=isP?Object.values(PCE).filter(c=>c.enseigne_id===id):(BY_ENS[id]||[]);
  const villes=[...new Set(centres.map(c=>geo(c).ville))];
  const nL=isP?centres.length:centres.flatMap(c=>BY_CENTRE[c.id]||[]).length;
  const tete=ficheTete(`Marque · ${isP?"parcs enfants":"escape games"}`,e.nom,
    `${plur(nL,u.lieuNom)} · ${esc(villes.slice(0,5).join(", "))}${villes.length>5?` et ${villes.length-5} autres villes`:""}`,
    `<button class="ghost" onclick="filtrerMarque(${js(id)})">Filtrer le tableau de bord</button>
     <button class="ghost" onclick="comparerMarque(${js(id)})">Comparer</button>${e.website?`<a class="ghost" href="${esc(e.website)}" target="_blank" rel="noopener">Site ↗</a>`:""}`);
  let tiles;
  if(!isP){const V=ventesStats(id,"");
    tiles=[tile({lab:"Occupation",val:pctTxt(t),vs:`marché ${pctTxt(tm)} ${ecart(t,tm)}`,meter:t,mark:tm}),
      tile({lab:"Prix médian d'une session",val:eur(median(T.prix)),vs:`marché ${eur(median(mk.prix))}`}),
      tile({lab:"Créneaux encore libres",val:nf(T.libres),sub:`sur ${nf(T.n)} proposés`}),
      tile({lab:"Joueurs par session",val:V.n>=ENS_MIN?V.jMed:"—",sub:V.n>=ENS_MIN?`${nf(V.n)} sessions mesurées · panier ${eur(V.pMed)}`:"pas encore assez de sessions mesurées"})];
  }else{
    tiles=[tile({lab:"Remplissage à venir",val:pctTxt(t),vs:`marché ${pctTxt(tm)} ${ecart(t,tm)}`,meter:t,mark:tm}),
      tile({lab:"CA billetterie déjà réservé",val:eurK(T.ca),sub:`${eurK(T.ca/Math.max(1,T.parcs.size))} par parc · ${pct(T.ca,mk.ca)} % du total suivi`}),
      tile({lab:"Entrée enfant · médiane",val:prixTxt(median(T.enf)),vs:`marché ${prixTxt(median(mk.enf))}`,sub:`adulte ${prixTxt(median(T.adu))}`}),
      tile({lab:"Créneaux complets",val:nf(T.complets),sub:`${pct(T.complets,T.n)} % · ${nf(T.vend)} places réservées`})];
  }
  const g=u.grp(rows,u.lieu);
  const lieux=isP?centres.map(c=>{const o=g[c.id];return {id:c.id,nom:c.nom,sub:geo(c).ville,t:o?remp(o):null,vend:o?o.vend:null,comp:o?pct(o.complets,o.n):null,prix:o?median(o.enf):null,ca:o?o.ca:null};})
    :centres.flatMap(c=>(BY_CENTRE[c.id]||[]).map(s=>{const o=g[s.id];return {id:s.id,nom:s.nom||"Salle",sub:`${c.nom||""} · ${geo(c).ville}`,t:o?occ(o):null,n:o?o.n:0,libres:o?o.libres:0,prix:o?median(o.prix):null,muet:MUET[s.id]?MUET_LIB[MUET[s.id].raison]:""};}));
  const tl=tbl("fm-lieux",isP?[{k:"nom",lab:"Parc",fmt:nomCell,cls:"w"},{k:"t",lab:"Remplissage",n:1,fmt:v=>v==null?"—":barCell(v,100,pctTxt(v))},{k:"vend",lab:"Places",n:1,fmt:nf},{k:"comp",lab:"Complets",n:1,fmt:v=>v==null?"—":v+" %"},{k:"prix",lab:"Enfant",n:1,fmt:prixTxt},{k:"ca",lab:"CA réservé",n:1,fmt:eurK}]
    :[{k:"nom",lab:"Salle",fmt:(v,r)=>nomCell(v,r)+(r.muet?` <span class="badge w">${esc(r.muet)}</span>`:""),cls:"w"},{k:"t",lab:"Occupation",n:1,fmt:v=>v==null?"—":barCell(v,100,pctTxt(v))},{k:"n",lab:"Créneaux",n:1,fmt:nf},{k:"libres",lab:"Libres",n:1,fmt:nf},{k:"prix",lab:"Prix médian",n:1,fmt:eur}],
    lieux,{def:{k:"t",d:-1},click:r=>`openFiche('${isP?"parc":"salle"}',${js(r.id)})`});
  let geoH="";
  if(villes.length>1){const gv=u.grp(rows,x=>{const c=u.centre(x);return c?geo(c).ville:null;});
    geoH=hbars(Object.entries(gv).map(([k,o])=>({lab:k,sub:plur(u.nLieux(o),u.lieuNom),v:u.taux(o),txt:pctTxt(u.taux(o))})).sort((a,b)=>b.v-a.v),{max:100});}
  let histo="",comptes="";
  if(isP){
    const hs=HIST&&HIST.parcs?Object.entries(HIST.parcs).filter(([cid,h])=>PCE[cid]&&PCE[cid].enseigne_id===id&&h.jours&&Object.keys(h.jours).length):[];
    if(hs.length){const w={};hs.forEach(([,h])=>histSemaines(h).forEach(([k,o])=>{const x=w[k]=w[k]||{e:0,ca:0,a:0};x.e+=o.e;x.ca+=o.ca;x.a+=o.a;}));
      const ks=Object.keys(w).sort(),tot=ks.reduce((a,k)=>a+w[k].e,0),ca=ks.reduce((a,k)=>a+w[k].ca,0);
      histo=`<div class="card"><div class="csub" style="margin-bottom:8px">${plur(hs.length,"parc")} sur ROLLER · ${nf(tot)} entrées vendues · ${eurK(ca)} depuis le ${frDate(ks[0])}</div>
        ${cols(ks.map(k=>({k,v:w[k].e,tip:[`Semaine du ${frDate(k)}`,`${nf(w[k].e)} entrées`,`${eurK(w[k].ca)}${w[k].a?` · ${w[k].a} anniversaires`:""}`]})),{fmt:v=>nf(v),lab:k=>frDate(k),we:false,h:130})}</div>`;}
    const so=((COMPTES||{}).societes||[]).filter(x=>(x.centres||[]).some(c=>PCE[c]&&PCE[c].enseigne_id===id)||(x.groupe||"").toLowerCase().includes((e.nom||"").toLowerCase()));
    if(so.length)comptes=tbl("fm-comptes",[{k:"nom",lab:"Société",fmt:(v,r)=>`<b>${esc(v)}</b><span class="sm">${esc(r.role||"")}</span>`,cls:"w"},{k:"k0",lab:"Exercice",n:1,fmt:v=>v?exLab(v):"—"},
        {k:"ca",lab:"CA",n:1,fmt:(v,r)=>r.k0?(v?eurK(v):`<span class="muted">confidentiel</span>`):`<span class="muted">aucun dépôt</span>`},{k:"rn",lab:"Résultat net",n:1,fmt:v=>v==null?"—":eurK(v)}],
      so.map(x=>{const ex=exo(x.finances),d=ex.find(([,v])=>v.ca||v.resultat_net!=null)||ex[0]||["",{}];return {...x,k0:d[0],ca:d[1].ca||null,rn:d[1].resultat_net??null};}),{def:{k:"ca",d:-1}});
  }else{
    const V=ventesStats(id,"");
    if(V.n>=ENS_MIN)comptes="";
  }
  return tete+`<div class="grid g2">${tiles.join("")}</div>`+
    sec(`Jour par jour · ${perLab()}`,`<div class="card">${joursAvec(u,rows,ref,"marché",e.nom)||'<div class="empty">Pas de créneau sur la période.</div>'}</div>`)+
    sec(`${cap(u.lieuxNom)} (${lieux.length})`,`<div class="card">${tl}</div>`)+
    (geoH?sec("Par ville",`<div class="card">${geoH}</div>`):"")+
    sec("Heures de pointe",`<div class="card">${heuresDe(u,rows,!isP)}</div>`)+
    (histo?sec("Historique réel (ROLLER) · entrées par semaine",histo):"")+
    (comptes?sec("Comptes publiés des sociétés",`<div class="card">${comptes}</div>`):"")+
    sec("Source et fraîcheur",`<div id="fm-src">${kv([["Site officiel",lien(e.website)],["Origine",isP?"billetteries publiques des parcs":"système de réservation officiel"],
      ["Période",perLab()],["Créneaux analysés",nf(T.n)],["Dernier relevé",isP?ago(rows.reduce((m,x)=>x.dernier_vu>m?x.dernier_vu:m,"")):"…"]])}</div>`);
}
async function releveMarque(id){
  const ids=(BY_ENS[id]||[]).flatMap(c=>BY_CENTRE[c.id]||[]).map(s=>s.id);if(!ids.length)return;
  try{const ls=await q(`sessions?select=dernier_vu&salle_id=in.(${ids.join(",")})&order=dernier_vu.desc&limit=1`);
    const el=document.querySelector("#fm-src .r:last-child span:last-child");if(el)el.textContent=ago(ls[0]&&ls[0].dernier_vu);}catch(_){}
}

/* ── fiche parc ── */
function ficheParc(cid){
  const c=PCE[cid];if(!c)return `<div class="empty">Parc introuvable.</div>`;
  const u=UNIV.parcs,e=PEN[c.enseigne_id]||{},g=geo(c);
  const tout=rowsP({m:"",z:""}),rows=tout.filter(x=>(parcOf(x.salle_id)||{}).id===cid),ref=tout.filter(x=>(parcOf(x.salle_id)||{}).enseigne_id===c.enseigne_id);
  const T=totP(rows),R=totP(ref),t=remp(T),tr=remp(R);
  const nbP=Object.values(PCE).filter(x=>x.enseigne_id===c.enseigne_id).length;
  const tete=ficheTete(`Parc · ${esc(e.nom||"")}`,c.nom,`${esc(c.adresse||"")}${c.cp?", "+esc(c.cp):""} ${esc(g.ville)} · ${esc(g.depLab)}`,
    `<button class="ghost" onclick="openFiche('marque',${js(c.enseigne_id)})">Voir la marque ${esc(e.nom||"")}</button>
     <a class="ghost" href="${esc(shopUrl(c))}" target="_blank" rel="noopener">Billetterie ↗</a>`);
  const px=rows.map(x=>x.prix_total||{}),enf=[...new Set(px.map(p=>p.enfant).filter(Boolean))].sort((a,b)=>a-b),adu=[...new Set(px.map(p=>p.adulte).filter(Boolean))].sort((a,b)=>a-b);
  const tiles=[tile({lab:"Remplissage à venir",val:pctTxt(t),vs:nbP>1?`moyenne ${esc(e.nom||"marque")} ${pctTxt(tr)} ${ecart(t,tr)}`:"",sub:`${nf(T.vend)} places réservées sur ${nf(T.init)}`,meter:t,mark:nbP>1?tr:null}),
    tile({lab:"CA billetterie déjà réservé",val:eurK(T.ca),sub:"places réservées × prix du créneau"}),
    tile({lab:"Créneaux complets",val:`${nf(T.complets)} / ${nf(T.n)}`,sub:`${nf(T.rest)} places encore libres`}),
    tile({lab:"Prix d'entrée",val:enf.length?prixTxt(median(T.enf)):"—",sub:`enfant ${enf.map(prixTxt).join(" / ")||"—"} · adulte ${adu.map(prixTxt).join(" / ")||"—"}`})];
  const h=HIST&&HIST.parcs&&HIST.parcs[cid];
  let histo="";
  if(h&&h.jours&&Object.keys(h.jours).length){const tt=histTot(h),sem=histSemaines(h);
    const mois={};histJours(h).forEach(([d,v])=>{const k=d.slice(0,7),o=mois[k]=mois[k]||{e:0,ca:0,j:0,a:0};o.e+=v.e||0;o.ca+=v.ca||0;o.j+=v.j||0;o.a+=v.a||0;});
    histo=`<div class="card"><div class="mini" style="border:0;padding:0;cursor:default"><div class="k" style="margin-top:0"><span><strong>${nf(tt.e)}</strong>entrées vendues</span><span><strong>${eurK(tt.ca)}</strong>CA estimé</span>
      <span><strong>${pctTxt(pct(tt.e,tt.j))}</strong>remplissage</span>${tt.a?`<span><strong>${nf(tt.a)}</strong>anniversaires</span>`:""}<span><strong>${frDate(tt.d0)}</strong>début</span></div></div>
      ${cols(sem.map(([k,o])=>({k,v:o.e,tip:[`Semaine du ${frDate(k)}`,`${nf(o.e)} entrées`,`${eurK(o.ca)}${o.a?` · ${o.a} anniversaires`:""} · ${o.jours} j ouverts`]})),{fmt:v=>nf(v),lab:k=>frDate(k),we:false,h:130})}
      <div style="margin-top:12px">${tbl("fp-mois",[{k:"k",lab:"Mois",fmt:v=>new Date(v+"-15").toLocaleDateString("fr-FR",{month:"long",year:"numeric"})},{k:"e",lab:"Entrées",n:1,fmt:nf},{k:"r",lab:"Remplissage",n:1,fmt:pctTxt},{k:"ca",lab:"CA estimé",n:1,fmt:eurK},{k:"a",lab:"Anniversaires",n:1,fmt:v=>v||"—"}],
        Object.entries(mois).map(([k,o])=>({k,e:o.e,r:pct(o.e,o.j),ca:o.ca,a:o.a})),{def:{k:"k",d:1}})}</div></div>`;}
  const so=((COMPTES||{}).societes||[]).filter(x=>(x.centres||[]).includes(cid)),de=((COMPTES||{}).declaratifs||[]).filter(x=>x.centre===cid);
  const lignesC=[...so.flatMap(x=>{const ex=exo(x.finances);return ex.length?ex.map(([k,v])=>({soc:x.nom,k,ca:v.ca||null,rn:v.resultat_net??null,note:""}))
      :[{soc:x.nom,k:"",ca:null,rn:null,note:`aucun compte déposé (créée ${(x.creation||"").slice(0,7)})`}];}),
    ...de.map(d=>({soc:d.societe,k:String(d.annee),ca:d.ca,rn:null,note:`${d.source}${d.visiteurs?` · ${nf(d.visiteurs)} visiteurs`:""}`}))];
  const comptes=lignesC.length?tbl("fp-comptes",[{k:"soc",lab:"Société",fmt:(v,r)=>`<b>${esc(v)}</b>${r.note?`<span class="sm">${esc(r.note)}</span>`:""}`,cls:"w"},{k:"k",lab:"Exercice",n:1,fmt:v=>v?exLab(v):"—"},
      {k:"ca",lab:"CA",n:1,fmt:(v,r)=>v?eurK(v):r.k?`<span class="muted">confidentiel</span>`:"—"},{k:"rn",lab:"Résultat net",n:1,fmt:v=>v==null?"—":eurK(v)}],lignesC,{def:{k:"k",d:-1}})+
    (so.some(x=>(x.centres||[]).length>1)?`<div class="note">${so.filter(x=>(x.centres||[]).length>1).map(x=>`${esc(x.nom)} exploite ${x.centres.length} parcs suivis : ses comptes couvrent l'ensemble.`).join(" ")}</div>`:""):"";
  const hm=nowHM(),libres=(PS||[]).filter(x=>(parcOf(x.salle_id)||{}).id===cid&&x.statut!=="retire"&&x.dispo&&x.places_restantes>0&&(x.date>TODAY||x.date===TODAY&&x.heure>=hm)).slice(0,16);
  const last=(PS||[]).filter(x=>(parcOf(x.salle_id)||{}).id===cid).reduce((m,x)=>x.dernier_vu>m?x.dernier_vu:m,"");
  return tete+`<div class="grid g2">${tiles.join("")}</div>`+
    sec(`Jour par jour · ${perLab()}`,`<div class="card">${joursAvec(u,rows,nbP>1?ref:null,`moyenne ${e.nom||"marque"}`,c.nom)||'<div class="empty">Pas de créneau sur la période.</div>'}</div>`)+
    sec("Heures de pointe",`<div class="card">${heuresDe(u,rows,false)}</div>`)+
    (histo?sec("Historique réel (ROLLER)",histo):"")+
    (comptes?sec("Comptes de la société exploitante",`<div class="card">${comptes}</div>`):"")+
    sec("Prochains créneaux réservables",`<div class="card">${libres.length?tbl("fp-libres",[{k:"date",lab:"Jour",fmt:v=>dlong(v)},{k:"heure",lab:"Heure",n:1},{k:"places_restantes",lab:"Places libres",n:1},
      {k:"e",lab:"Enfant",n:1,fmt:prixTxt},{k:"a",lab:"Adulte",n:1,fmt:prixTxt}],libres.map(x=>({...x,e:(x.prix_total||{}).enfant,a:(x.prix_total||{}).adulte})),{def:{k:"date",d:1}})
      :'<div class="empty">Complet sur la période observée.</div>'}</div>`)+
    sec("Source et fraîcheur",kv([["Billetterie",lien(shopUrl(c))],e.website&&e.website!==shopUrl(c)?["Site officiel",lien(e.website)]:null,
      ["Mesure",cid.includes(".qweekle.shop")?"jauge publiée par la billetterie":"places relevées sur la billetterie publique"],
      ["Jauge de référence",T.n?`${nf(T.init/T.n)} places par créneau (moyenne)`:"—"],["Dernier relevé",ago(last)]]));
}

/* ── fiche salle (escape) ── */
function ficheSalle(sid){
  const s=SA[sid];if(!s)return `<div class="empty">Salle introuvable.</div>`;
  const u=UNIV.escape,c=CENTRE_OF[sid]||{},eid=ENS_OF[sid],e=EN[eid]||{};
  const tout=rowsE({m:"",z:""}),rows=tout.filter(x=>x.salle_id===sid),ref=tout.filter(x=>ENS_OF[x.salle_id]===eid);
  const T=totE(rows),R=totE(ref),t=occ(T),tr=occ(R),nS=(BY_ENS[eid]||[]).flatMap(x=>BY_CENTRE[x.id]||[]).length;
  const meta=[s.theme&&cap(s.theme),s.duree_minutes&&s.duree_minutes+" min",(s.joueurs_min||s.joueurs_max)&&`${s.joueurs_min||"?"} à ${s.joueurs_max||"?"} joueurs`,
    s.difficulty&&"difficulté "+"★".repeat(Math.min(5,s.difficulty))].filter(Boolean).join(" · ");
  const tete=ficheTete(`Salle · ${esc(e.nom||"")}`,s.nom||"Salle",`${esc(c.nom||"")}${c.nom?" · ":""}${esc(geo(c).ville)}${meta?" · "+esc(meta):""}`,
    `<button class="ghost" onclick="openFiche('marque',${js(eid)})">Voir la marque ${esc(e.nom||"")}</button>${e.website?`<a class="ghost" href="${esc(e.website)}" target="_blank" rel="noopener">Site ↗</a>`:""}`);
  const tiles=[tile({lab:"Occupation à venir",val:PUBLIE.has(sid)?pctTxt(t):"—",vs:nS>1&&PUBLIE.has(sid)?`moyenne ${esc(e.nom||"")} ${pctTxt(tr)} ${ecart(t,tr)}`:"",meter:PUBLIE.has(sid)?t:null,mark:nS>1?tr:null,
      sub:PUBLIE.has(sid)?`${nf(T.n-T.libres)} créneaux pris sur ${nf(T.n)}`:"aucun créneau libre observé : exclue des taux"}),
    tile({lab:"Prix médian d'une session",val:eur(median(T.prix)),sub:"groupe type de 4 joueurs"})];
  const hm=nowHM(),next=SESS.filter(x=>x.salle_id===sid&&x.dispo&&x.statut!=="retire"&&(x.date>TODAY||x.date===TODAY&&x.heure>=hm)).slice(0,18);
  return tete+`<div class="grid g2">${tiles.join("")}</div>`+
    (MUET[sid]?`<div class="card" style="margin-top:14px"><span class="badge w">${esc(MUET_LIB[MUET[sid].raison])}</span> <span class="ink2" style="font-size:13px">aucun créneau libre observé : la salle est exclue des taux d'occupation.</span></div>`:"")+
    sec(`Jour par jour · ${perLab()}`,`<div class="card">${PUBLIE.has(sid)?joursAvec(u,rows,nS>1?ref:null,`moyenne ${e.nom||"marque"}`,s.nom||"Salle"):""||'<div class="empty">Pas de disponibilité publiée.</div>'}</div>`)+
    sec("Prochains créneaux libres",`<div class="card">${next.length?tbl("fs-next",[{k:"date",lab:"Jour",fmt:v=>dlong(v)},{k:"heure",lab:"Heure",n:1},{k:"prix_total_moyen",lab:"Prix (4 joueurs)",n:1,fmt:eur}],next,{def:{k:"date",d:1}})
      :'<div class="empty">Complet sur la période observée.</div>'}</div>`)+
    sec("Source et fraîcheur",`<div id="fs-src">${kv([["Site officiel",lien(e.website)],["Origine","système de réservation officiel"],["Créneaux à venir",nf(SESS.filter(x=>x.salle_id===sid).length)],["Dernier relevé","…"]])}</div>`);
}
async function releveSalle(sid){
  try{const ls=await q(`sessions?select=dernier_vu&salle_id=eq.${encodeURIComponent(sid)}&order=dernier_vu.desc&limit=1`);
    const el=document.querySelector("#fs-src .r:last-child span:last-child");if(el)el.textContent=ago(ls[0]&&ls[0].dernier_vu);}catch(_){}
}

/* ── fiche zone ── */
function ficheZone(key){
  const i=key.indexOf("|"),niv=key.slice(0,i),val=key.slice(i+1),u=U(),esc_=S.u==="escape";
  const dans=c=>{const g=geo(c);return (niv==="zone"?g.zone:niv==="reg"?g.reg:niv==="dep"?g.depLab:g.ville)===val;};
  const tout=u.rows({z:""}),rows=tout.filter(x=>{const c=u.centre(x);return c&&dans(c);}),T=u.tot(rows),mk=u.tot(tout),t=u.taux(T),tm=u.taux(mk);
  const f=filtreDe(niv,val);
  const tete=ficheTete(`${{zone:"Zone",reg:"Région",dep:"Département",ville:"Ville"}[niv]} · ${esc_?"escape games":"parcs enfants"}`,val,
    `${plur(u.nLieux(T),u.lieuNom)} · ${plur(T.ens.size,"marque")}${S.m?` · marque filtrée : ${esc(nomM(S.m))}`:""} · ${perLab()}`,
    f?`<button class="ghost" onclick="closeFiche(true);setZ(${js(f)})">Filtrer le tableau de bord sur cette zone</button>`:"");
  const tiles=esc_?[tile({lab:"Occupation",val:pctTxt(t),vs:`ensemble ${pctTxt(tm)} ${ecart(t,tm)}`,meter:t,mark:tm}),tile({lab:"Prix médian d'une session",val:eur(median(T.prix)),vs:`ensemble ${eur(median(mk.prix))}`}),
      tile({lab:"Créneaux proposés",val:nf(T.n),sub:`${nf(T.libres)} encore libres`}),tile({lab:"Salles",val:nf(T.salles.size),sub:plur(T.centres.size,"centre")})]
    :[tile({lab:"Remplissage à venir",val:pctTxt(t),vs:`ensemble ${pctTxt(tm)} ${ecart(t,tm)}`,meter:t,mark:tm}),tile({lab:"CA billetterie déjà réservé",val:eurK(T.ca),sub:`${pct(T.ca,mk.ca)} % du total suivi`}),
      tile({lab:"Entrée enfant · médiane",val:prixTxt(median(T.enf)),vs:`ensemble ${prixTxt(median(mk.enf))}`}),tile({lab:"Parcs",val:nf(T.parcs.size),sub:plur(T.ens.size,"marque")})];
  const gm=u.grp(rows,u.ens);
  const bm=hbars(Object.entries(gm).map(([id,o])=>({lab:nomM(id),sub:plur(u.nLieux(o),u.lieuNom)+(esc_?"":` · ${eurK(o.ca)}`),v:u.taux(o),txt:pctTxt(u.taux(o)),hl:id===S.m,
    click:`openFiche('marque',${js(id)})`})).sort((a,b)=>b.v-a.v),{max:100});
  const g=u.grp(rows,u.lieu);
  const lieux=Object.entries(g).map(([id,o])=>{const c=esc_?CENTRE_OF[id]:PCE[id];
    return {id,nom:esc_?(SA[id]||{}).nom||"Salle":c.nom,sub:`${nomM(c.enseigne_id)} · ${geo(c).ville}`,t:u.taux(o),n:o.n,prix:median(esc_?o.prix:o.enf),ca:o.ca};});
  const tl=tbl("fz-lieux",[{k:"nom",lab:esc_?"Salle":"Parc",fmt:nomCell,cls:"w"},{k:"t",lab:u.tauxLab,n:1,fmt:v=>barCell(v,100,pctTxt(v))},
    ...(esc_?[{k:"n",lab:"Créneaux",n:1,fmt:nf},{k:"prix",lab:"Prix médian",n:1,fmt:eur}]:[{k:"prix",lab:"Enfant",n:1,fmt:prixTxt},{k:"ca",lab:"CA réservé",n:1,fmt:eurK}])],
    lieux,{def:{k:"t",d:-1},limit:40,click:r=>`openFiche('${esc_?"salle":"parc"}',${js(r.id)})`});
  return tete+`<div class="grid g2">${tiles.join("")}</div>`+sec("Marques présentes",`<div class="card">${bm}</div>`)+
    sec(`Jour par jour · ${perLab()}`,`<div class="card">${joursAvec(u,rows,tout,"ensemble",val)}</div>`)+
    sec(`${cap(u.lieuxNom)} (${lieux.length})`,`<div class="card">${tl}</div>`);
}

/* ── méthodologie ── */
function openMethodo(){openFiche("methodo","sources");}
function ficheMethodo(){
  const nE=Object.keys(EN).length,nC=Object.keys(CE).length,nS=Object.keys(SA).length;
  const p=t=>`<div class="card" style="font-size:13px;line-height:1.6;color:var(--ink-2)">${t}</div>`;
  return ficheTete("Méthodologie","D'où viennent les chiffres","Ce que mesure chaque indicateur, et ce qu'il ne mesure pas.")+
    sec("Couverture",kv([["Marques d'escape games",nf(nE)],["Centres",nf(nC)],["Salles",nf(nS)],["Parcs enfants",nf(Object.keys(PCE).length)],
      ["Créneaux escape chargés",nf(SESS.length)],["Dernier relevé",ago(FRESH)]]))+
    sec("Escape games · origine",p(`Les disponibilités sont relevées automatiquement sur les <b>systèmes de réservation officiels</b> des marques
      (données publiques affichées au client), toutes les ~10 minutes. Chaque fiche indique sa source et l'heure du dernier relevé.`))+
    sec("Escape games · occupation",p(`<b>Occupation</b> = part des créneaux publiés qui ne sont plus réservables. Un créneau peut être indisponible
      parce qu'il est réservé <i>ou</i> parce que la salle est fermée : l'indicateur mesure la <b>disponibilité commerciale</b>, une borne haute de la
      fréquentation réelle. Les cases de heatmap avec moins de 3 relevés ne sont pas colorées.<br>
      • <b>${nf(N_NOPUB)} salles</b> n'ont jamais affiché le moindre créneau libre : elles ne publient pas leurs disponibilités (fermée, réservation par
      téléphone…). Elles sont <b>exclues des taux</b> (sinon elles ressortiraient à « 100 % occupé ») et signalées dans la vue Salles.<br>
      • Le <b>dernier jour de l'horizon</b>, publié partiellement par les marques, est écarté.<br>
      • Un créneau qui disparaît avant son heure a été <b>retiré</b> par la marque : ni libre ni occupé.`))+
    sec("Escape games · prix et joueurs",p(`<b>Prix médian</b> : prix total d'une session pour un <b>groupe type de 4 joueurs</b> (ou la taille min./max. de la
      salle si 4 sort de sa plage) — une estimation : la taille réelle des groupes n'est pas publiée pour les salles privées.<br>
      <b>Joueurs et panier réels</b> : quand une session se vend à la place, le nombre de places libres baisse à chaque vente. Suivi depuis le
      ${frDate(TRACK_START)} ; seules les sessions suivies au moins ${SUIVI_MIN} jours avant leur date comptent. Une session qui passe d'un coup à complet
      est traitée comme une <b>privatisation</b> et écartée. Marques avec moins de ${ENS_MIN} sessions mesurées : non détaillées.`))+
    sec("Parcs enfants · mesure",p(`Pour chaque créneau des 14 prochains jours, les <b>places encore réservables</b>, relevées toutes les ~30 minutes sur la
      billetterie publique (Qweekle, ROLLER, Cité des sciences, Event Calendar, Apex Timing, Wix Bookings). Toutes les entrées d'un parc (enfant, adulte,
      bébé…) puisent dans la même jauge.<br>
      • Quand la billetterie n'affiche pas le nombre de places, il est retrouvé en essayant plusieurs quantités ; la <b>jauge</b>, quand elle n'est pas
      publiée, est la valeur haute habituelle du parc (créneaux à J+7 et au-delà, presque vides).<br>
      • <b>Arrivées ou présences</b> : Palomano vend un quota d'arrivées par créneau ; Gulli Parc, Rêvopolie, Octopia ou You Kids appliquent la jauge
      pendant toute la visite. Ces présences sont converties en entrées (× intervalle entre créneaux / durée de visite).<br>
      • <b>Remplissage</b> = places réservées / jauge : une part de jauge vendue en ligne, pas une fréquentation (les entrées sur place ne sont pas vues).
      Un créneau qui disparaît de la vente plus de 90 min avant l'heure est compté complet.`))+
    sec("Parcs enfants · chiffre d'affaires",p(`<b>CA billetterie</b> = places réservées × prix du créneau, avec un panier par place égal à la moyenne des prix
      enfant et adulte (calage : Palomano Clichy déclare 10,1 € par visiteur). Ni les entrées achetées sur place, ni les anniversaires, ni la restauration.
      « Déjà réservé » porte sur les créneaux à venir ; « réalisé » sur les créneaux passés, dans leur état juste avant l'ouverture.`))+
    sec("Parcs enfants · rétrospectif",p(`<b>Historique réel</b> : ROLLER (Palomano Clichy et Alfortville, les 12 You Kids) publie aussi les séances passées
      avec leurs places restantes finales — ventes en caisse comprises a priori. Les premières semaines, encore vendues sur l'ancien système, sont écartées.
      Ailleurs, aucune date passée n'est publiée (vérifié : Qweekle, Cité des sciences) : l'historique se construit depuis le ${frDate(PARC_DEBUT)}.<br>
      <b>Comptes publiés</b> : comptes déposés au greffe (registre public et comptes INPI, tous exercices) de 65 sociétés rattachées à leur parc par
      adresse d'établissement — CA souvent confidentiel pour les petites sociétés.`))+
    sec("Parcs enfants · couverture",p(`72 parcs : les 19 Palomano et leurs concurrents qui vendent l'entrée datée en ligne — Rêvopolie, Octopia, Bulles &amp; Billes,
      Île de la Tortuga, Cité des enfants, Petit Nuage, Le Monde d'Ayden, Les Zacroc's, You Kids, Kawatee, Quand je serai grand, Toumini City,
      Royal Kids Roissy-en-Brie, Planet Park, les 20 Gulli Parc, Kidz World (Lyon), Little City, Chibitopia, Kizou Aventures.
      <b>Non mesurables</b> : les autres Royal Kids (dont Montreuil et Épône), Planet Park Cormeilles (billets non datés), Happy City, Youpi'Parc,
      Ludiqland (paiement sur place), Kingooroo (fermé), Kid's Palace, Filou Planet, L'Île de Robinson (pas de billetterie).`));
}

addEventListener("keydown",e=>{if(e.key==="Escape"&&FICHE.length)closeFiche();});

  const t=getComputedStyle(document.documentElement).colorScheme==="dark"?"light":"dark";
