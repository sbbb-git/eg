<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="robots" content="noindex, nofollow">
<title>Observatoire Escape · Île-de-France</title>
<style>
:root{
  /* surfaces & encre — palette dataviz validée (mode sombre) */
  --plane:#0d0d0d; --surface:#1a1a19; --surface-2:#121211;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --hair:rgba(255,255,255,.10);
  /* série (une seule série -> une seule couleur) */
  --s1:#3987e5;
  /* statut (réservé, jamais série) */
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  /* ramp séquentiel occupation (validé : monotone, gaps>=.06, light-end 2.15:1) */
  --h1:#184f95; --h2:#256abf; --h3:#3987e5; --h4:#6da7ec; --h5:#9ec5f4; --h6:#cde2fb;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--plane);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{margin:0;font-weight:650}
a{color:inherit}
button{font:inherit}

/* ── gate ── */
#gate{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 20%,#1c1c1a,#0d0d0d)}
#gate .box{background:var(--surface);border:1px solid var(--hair);padding:32px 34px;border-radius:18px;width:340px}
#gate h1{font-size:18px;margin-bottom:4px}
#gate p{color:var(--muted);font-size:13px;margin:0 0 22px}
#gate input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--hair);
  background:var(--surface-2);color:var(--ink);font-size:15px;margin-bottom:10px}
#gate button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--s1);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
#gate .err{color:var(--crit);font-size:13px;min-height:18px;margin-top:8px}

/* ── shell ── */
#app{display:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--hair);background:var(--plane);position:sticky;top:0;z-index:60}
.htop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0}
.brand{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:650}
.live{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);flex:0 0 auto}
.hmeta{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}
.ghost{background:none;border:1px solid var(--hair);color:var(--ink-2);padding:6px 10px;border-radius:9px;cursor:pointer;font-size:12px}
.ghost:hover{border-color:var(--s1);color:var(--ink)}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;color:var(--muted);padding:11px 14px;font-size:13.5px;font-weight:600;
  border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--s1)}

/* filtres : UNE seule rangée au-dessus de tout ce qu'elle cadre */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 0 2px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--hair);border-radius:10px;padding:2px}
.seg button{background:none;border:0;color:var(--muted);padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.4)}
select,input.txt{background:var(--surface-2);border:1px solid var(--hair);color:var(--ink);
  border-radius:10px;padding:9px 11px;font-size:13px}
input.txt{flex:1;min-width:150px}
.fnote{color:var(--muted);font-size:12px;margin-left:auto}

main{padding:6px 0 60px}
.grid{display:grid;gap:12px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.two{grid-template-columns:1fr 1fr}
@media(max-width:860px){.two{grid-template-columns:1fr}}

/* Les enfants de grille/flex ont min-width:auto : sans ce reset ils s'élargissent
   au contenu (la heatmap large) au lieu de la laisser défiler en interne, ce qui
   fait déborder la page horizontalement sur mobile. */
.grid>*,.card,.chead>div,.row>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);padding:16px 18px}
.card.pad0{padding:16px 18px 10px}
.ctitle{font-size:14px;font-weight:650}
.csub{color:var(--muted);font-size:12px;margin-top:2px;line-height:1.45}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.tbtn{background:none;border:1px solid var(--hair);color:var(--muted);border-radius:8px;padding:4px 8px;font-size:11px;cursor:pointer;white-space:nowrap}
.tbtn:hover{color:var(--ink);border-color:var(--s1)}

/* stat tiles */
.tile .lab{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.01em}
.tile .val{font-size:31px;line-height:1.1;margin:7px 0 3px;font-weight:680}
.tile .ctx{color:var(--ink-2);font-size:12.5px}
.bar-mini{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:9px}
.bar-mini i{display:block;height:100%;background:var(--s1);border-radius:3px}

/* heatmap */
.hm{width:100%;overflow-x:auto}
.hm table{border-collapse:separate;border-spacing:2px;width:100%;min-width:520px}
.hm th{color:var(--muted);font-size:11px;font-weight:600;padding:0 0 4px;text-align:center;font-variant-numeric:tabular-nums}
/* libellé de jour : largeur garantie, sinon il se replie sur la 1re cellule en
   étroit. (Pas de position:sticky ici : dans un tableau à border-spacing, ça
   décale le texte et le fait chevaucher la première cellule.) */
.hm th.row{text-align:right;padding-right:10px;min-width:46px;width:46px;vertical-align:middle}
.hm td{height:34px;border-radius:5px;text-align:center;font-size:11px;font-variant-numeric:tabular-nums;
  color:#0b0b0b;font-weight:650;cursor:default}
.hm td.nd{background:var(--surface-2);border:1px solid var(--hair);color:var(--muted);font-weight:500}
.legend{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--muted);font-size:11.5px;flex-wrap:wrap}
.legend .sw{display:flex;gap:2px}
.legend .sw i{width:26px;height:9px;border-radius:2px;display:block}

/* barres classement */
.rank{display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:minmax(96px,260px) 1fr auto;gap:14px;align-items:center;cursor:pointer}
.row:hover .nm{color:var(--ink)}
.nm{color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:9px;background:var(--grid);border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.pct{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;min-width:38px;text-align:right;font-weight:650}

/* tableau (table view — jumeau accessible de chaque graphe) */
table.tv{width:100%;border-collapse:collapse;font-size:12.5px}
table.tv th,table.tv td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--hair);font-variant-numeric:tabular-nums}
table.tv th{color:var(--muted);font-weight:600;font-size:11.5px}
table.tv td.n,table.tv th.n{text-align:right}

/* listes / drilldown */
.item{background:var(--surface-2);border:1px solid var(--hair);border-radius:11px;padding:12px 13px;margin-bottom:8px;cursor:pointer}
.item:hover{border-color:var(--s1)}
.item h4{font-size:14px}
.item .meta{color:var(--muted);font-size:12px;margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--hair);border-radius:999px;padding:3px 9px;font-size:11px;color:var(--muted)}
.chip.g{color:var(--good);border-color:rgba(12,163,12,.35)}
.chip.c{color:var(--warn);border-color:rgba(250,178,25,.3)}

#ov{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);z-index:200;display:none}
#ov.on{display:block}
#sheet{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);overflow-y:auto;background:var(--plane);
  border-left:1px solid var(--hair);padding:18px 18px calc(30px + env(safe-area-inset-bottom))}
@media(max-width:600px){#sheet{top:auto;width:100%;max-height:90vh;border-left:0;border-top:1px solid var(--hair);border-radius:18px 18px 0 0}}
.sbar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-18px;background:var(--plane);padding:6px 0 10px;z-index:2}
.sbar button{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:4px}
.sbar button:hover{color:var(--ink)}
.src{background:var(--surface-2);border:1px solid var(--hair);border-radius:12px;padding:12px 14px;margin:14px 0}
.src h4{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px}
.src .r{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:12.5px;border-bottom:1px solid rgba(255,255,255,.05)}
.src .r:last-child{border:0}
.src .k{color:var(--muted)}
.src .r a{color:var(--s1);text-decoration:none;text-align:right;word-break:break-all}
.center{text-align:center;color:var(--muted);padding:44px 0;font-size:13.5px}
.skel{opacity:.45;transition:opacity .2s}

/* tooltip partagé */
#tip{position:fixed;z-index:400;pointer-events:none;background:var(--surface);border:1px solid var(--hair);
  border-radius:9px;padding:8px 10px;font-size:12px;color:var(--ink);box-shadow:0 8px 26px rgba(0,0,0,.55);display:none;max-width:230px}
#tip b{display:block;margin-bottom:3px}
#tip .m{color:var(--muted)}
#map{height:66vh;border-radius:var(--r);border:1px solid var(--hair)}
@media(max-width:600px){
  .brand{font-size:13.5px}
  #fresh{display:none}                 /* l'info reste dans « Méthodologie » */
  .tiles{grid-template-columns:1fr 1fr}
  .tile .val{font-size:26px}
  .fnote{margin-left:0;width:100%}
}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.leaflet-popup-content a{color:var(--s1)}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<div id="gate"><div class="box">
  <h1>Observatoire Escape · IDF</h1>
  <p>Accès privé — benchmark interne</p>
  <input id="pw" type="password" placeholder="Mot de passe" autocomplete="off" onkeydown="if(event.key==='Enter')check()">
  <button onclick="check()">Entrer</button>
  <div class="err" id="err"></div>
</div></div>

<div id="app">
  <header>
    <div class="wrap">
      <div class="htop">
        <div class="brand"><span class="live"></span> Observatoire Escape · Île-de-France</div>
        <div class="hmeta"><span id="fresh">—</span>
          <button class="ghost" onclick="openMethodo()">Méthodologie</button>
          <button class="ghost" onclick="logout()">Quitter</button></div>
      </div>
      <nav id="nav">
        <button data-t="vue" class="on">Vue d'ensemble</button>
        <button data-t="enseignes">Enseignes</button>
        <button data-t="salles">Salles</button>
        <button data-t="carte">Carte</button>
      </nav>
    </div>
  </header>

  <div class="wrap">
    <div class="filters" id="filters">
      <div class="seg" id="segper">
        <button data-p="7" class="on">7 jours</button>
        <button data-p="we">Week-end</button>
        <button data-p="soir">Ce soir</button>
        <button data-p="all">Tout</button>
      </div>
      <select id="fville"><option value="">Toutes les villes</option></select>
      <span class="fnote" id="fnote"></span>
    </div>
    <main id="view"><div class="center">Chargement des relevés…</div></main>
  </div>
</div>

<div id="ov"><div id="sheet"></div></div>
<div id="tip"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ═════════ accès ═════════ */
const SALT="eg-obs-2026::";
const PW_HASH="3051e55a55f577cba6ecfe04c946a1273b1eaf74c4f67daef994af7e55c8fa0c";
const AUTH="escape_idf_auth";
async function sha256(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(SALT+s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function check(){
  if(await sha256(document.getElementById("pw").value.trim().toLowerCase())===PW_HASH){
    sessionStorage.setItem(AUTH,PW_HASH);enter();
  } else document.getElementById("err").textContent="Mot de passe incorrect.";}
function logout(){sessionStorage.removeItem(AUTH);location.reload();}
function enter(){
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="block";
  if(!window._boot){window._boot=1;boot().catch(e=>$("#view").innerHTML=
    `<div class="center">Impossible de charger les données (${e.message}).<br>Réessaie dans un instant.</div>`);}
}
if(sessionStorage.getItem(AUTH)===PW_HASH)addEventListener("DOMContentLoaded",enter);

/* ═════════ données ═════════ */
const API="https://nbvronwfvoksonatolcs.supabase.co/rest/v1";
const KEY="sb_publishable_5vFAbOG-hHH0s9mAoYmGyA_EG4bIQYj";
const H={apikey:KEY,Authorization:"Bearer "+KEY};
const $=s=>document.querySelector(s);
const esc=s=>(s||"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1).toLowerCase():"";
const pct=(a,b)=>b?Math.round(100*a/b):0;
const eur=v=>v==null?"—":Math.round(v)+" €";
const iso=d=>d.toISOString().slice(0,10);
const TODAY=iso(new Date());
const JOURS=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const BUCKETS=[[0,12,"–12h"],[12,14,"12-14"],[14,16,"14-16"],[16,18,"16-18"],[18,20,"18-20"],[20,22,"20-22"],[22,24,"22h+"]];
const RAMP=["--h1","--h2","--h3","--h4","--h5","--h6"];
const dlong=d=>new Date(d+"T12:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const ago=t=>{if(!t)return"—";const m=Math.round((Date.now()-new Date(t))/6e4);
  return m<2?"à l'instant":m<60?`il y a ${m} min`:m<1440?`il y a ${Math.round(m/60)} h`:`il y a ${Math.round(m/1440)} j`;};

async function q(p){const r=await fetch(API+"/"+p,{headers:H});if(!r.ok)throw new Error("API "+r.status);return r.json();}
async function qPage(p,from){const r=await fetch(API+"/"+p,{headers:{...H,Range:`${from}-${from+999}`}});
  if(!r.ok)throw new Error("API "+r.status);return r.json();}
async function qCount(p){const r=await fetch(API+"/"+p+"&limit=1",{headers:{...H,Prefer:"count=exact",Range:"0-0"}});
  const cr=r.headers.get("content-range");return cr&&cr.includes("/")?(+cr.split("/")[1]||0):0;}

let EN={},CE={},SA={},BY_ENS={},BY_CENTRE={},CENTRE_OF={},ENS_OF={},SESS=[],FRESH=null,map=null;
let PER="7", VILLE="", TAB="vue";
/* Deux garde-fous de justesse, calculés une fois après chargement :
   DAY_OK  : on écarte les jours de bord d'horizon (le scraper voit ~7 j, le
             dernier jour n'est que partiellement publié -> fausse occupation).
   PUBLIE  : une salle qui n'a JAMAIS eu un créneau libre ne se remplit pas à
             100 %, elle ne publie simplement pas ses dispos (fermée/bloquée).
             On la sort des taux d'occupation et on la compte à part. */
let DAY_OK=new Set(), PUBLIE=new Set(), N_NOPUB=0;
function calibrate(){
  const byDay={};
  SESS.forEach(x=>byDay[x.date]=(byDay[x.date]||0)+1);
  const counts=Object.values(byDay).sort((a,b)=>a-b);
  const med=counts.length?counts[Math.floor(counts.length/2)]:0;
  DAY_OK=new Set(Object.keys(byDay).filter(d=>byDay[d]>=med*0.3));
  const seenFree={},allSalles=new Set();
  SESS.forEach(x=>{if(!DAY_OK.has(x.date))return;allSalles.add(x.salle_id);
    if(x.dispo)seenFree[x.salle_id]=1;});
  PUBLIE=new Set(Object.keys(seenFree));
  N_NOPUB=[...allSalles].filter(s=>!PUBLIE.has(s)).length;
}

async function boot(){
  const nSess=await qCount(`sessions?select=salle_id&date=gte.${TODAY}`);
  const pages=Math.min(Math.ceil(nSess/1000),20);
  const sel=`sessions?select=salle_id,date,heure,dispo,prix_total_moyen&date=gte.${TODAY}&order=date,heure`;
  const [ens,cent,sal,fresh,...chunks]=await Promise.all([
    q("enseignes?select=id,nom,website&order=nom"),
    q("centres?select=id,nom,ville,cp,adresse,lat,lon,enseigne_id"),
    q("salles?select=id,nom,theme,duree_minutes,joueurs_min,joueurs_max,difficulty,centre_id"),
    q("sessions?select=dernier_vu&order=dernier_vu.desc&limit=1"),
    ...Array.from({length:pages},(_,i)=>qPage(sel,i*1000))
  ]);
  ens.forEach(e=>EN[e.id]=e);
  cent.forEach(c=>{CE[c.id]=c;(BY_ENS[c.enseigne_id]=BY_ENS[c.enseigne_id]||[]).push(c);});
  sal.forEach(s=>{SA[s.id]=s;(BY_CENTRE[s.centre_id]=BY_CENTRE[s.centre_id]||[]).push(s);
    const c=CE[s.centre_id];CENTRE_OF[s.id]=c;if(c)ENS_OF[s.id]=c.enseigne_id;});
  SESS=chunks.flat();
  calibrate();
  FRESH=fresh[0]&&fresh[0].dernier_vu;
  $("#fresh").textContent="relevé "+ago(FRESH);
  const villes=[...new Set(cent.map(c=>c.ville).filter(Boolean))].sort();
  $("#fville").innerHTML=`<option value="">Toutes les villes</option>`+
    villes.map(v=>`<option value="${esc(v)}">${esc(cap(v))}</option>`).join("");
  render();
}

/* ── filtrage (une rangée de filtres cadre TOUS les graphes) ── */
function slice(){
  const now=new Date(), end=new Date();
  let from=TODAY, to=null, hFrom=null;
  if(PER==="7"){end.setDate(now.getDate()+7);to=iso(end);}
  else if(PER==="soir"){to=TODAY;hFrom=17;}
  else if(PER==="we"){const d=now.getDay(),add=(6-d+7)%7;const s=new Date();s.setDate(now.getDate()+add);
    const e=new Date(s);e.setDate(s.getDate()+1);from=iso(s);to=iso(e);}
  return SESS.filter(x=>{
    if(!DAY_OK.has(x.date))return false;          // jour de bord d'horizon -> écarté
    if(x.date<from)return false;
    if(to&&x.date>to)return false;
    if(hFrom!=null&&+x.heure.slice(0,2)<hFrom)return false;
    if(VILLE){const c=CENTRE_OF[x.salle_id];if(!c||c.ville!==VILLE)return false;}
    return true;});
}
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);return s[Math.floor(s.length/2)];};

function aggregate(all){
  /* Les taux d'occupation ne portent QUE sur les salles qui publient leurs
     disponibilités ; les autres sont comptées à part (dispo non publiée). */
  const rows=all.filter(x=>PUBLIE.has(x.salle_id));
  const A={n:rows.length,libres:0,prix:[],parEns:{},heat:{},topSalle:{},
           nHors:all.length-rows.length,
           sallesHors:new Set(all.filter(x=>!PUBLIE.has(x.salle_id)).map(x=>x.salle_id)).size};
  for(const x of rows){
    if(x.dispo)A.libres++;
    if(x.prix_total_moyen)A.prix.push(x.prix_total_moyen);
    const eid=ENS_OF[x.salle_id];
    if(eid){const e=A.parEns[eid]=A.parEns[eid]||{n:0,libres:0,prix:[]};
      e.n++;if(x.dispo)e.libres++;if(x.prix_total_moyen)e.prix.push(x.prix_total_moyen);}
    const t=A.topSalle[x.salle_id]=A.topSalle[x.salle_id]||{n:0,libres:0};
    t.n++;if(x.dispo)t.libres++;
    const jd=(new Date(x.date+"T12:00").getDay()+6)%7, h=+x.heure.slice(0,2);
    const bi=BUCKETS.findIndex(b=>h>=b[0]&&h<b[1]);
    if(bi>=0){const k=jd+"|"+bi;const c=A.heat[k]=A.heat[k]||{n:0,libres:0};c.n++;if(x.dispo)c.libres++;}
  }
  return A;
}

/* ═════════ rendu ═════════ */
function render(){
  const rows=slice(), A=aggregate(rows);
  $("#fnote").textContent=`${rows.length.toLocaleString("fr-FR")} créneaux analysés`;
  const v=$("#view");
  if(TAB==="vue")v.innerHTML=viewVue(A);
  else if(TAB==="enseignes")v.innerHTML=viewEnseignes(A);
  else if(TAB==="salles")v.innerHTML=viewSalles(A);
  else viewCarte(A);
  if(TAB==="vue"||TAB==="enseignes"||TAB==="salles")wireHovers();
}

function viewVue(A){

    {lab:"Prix médian / session",val:eur(pm),ctx:pm?`fourchette ${eur(A.prix.reduce((a,b)=>b<a?b:a))} – ${eur(A.prix.reduce((a,b)=>b>a?b:a))}`:"prix non publiés"},
    {lab:"Salles mesurées",val:salles,ctx:`${Object.keys(A.parEns).length} enseignes${A.sallesHors?` · ${A.sallesHors} salles sans dispo publiée, exclues`:""}`},

/* Heatmap : occupation par jour × tranche horaire (séquentiel, 1 teinte) */
function cardHeatmap(A){
  const cells=[];
  for(let j=0;j<7;j++)for(let b=0;b<BUCKETS.length;b++){
    const c=A.heat[j+"|"+b];
    cells.push({j,b,occ:c&&c.n>=3?pct(c.n-c.libres,c.n):null,n:c?c.n:0});
  }
  /* L'échelle couleur épouse l'amplitude RÉELLE observée : sur 0–100 %, des
     valeurs toutes comprises entre 13 % et 38 % s'écraseraient sur deux paliers
     et la heatmap paraîtrait uniforme. Les bornes sont affichées en légende. */
  const vals=cells.filter(c=>c.occ!=null).map(c=>c.occ);
  const lo=vals.length?Math.min(...vals):0, hi=vals.length?Math.max(...vals):100;
  const span=Math.max(1,hi-lo);
  const body=JOURS.map((jn,j)=>`<tr><th class="row">${jn}</th>`+BUCKETS.map((bk,b)=>{
    const c=cells.find(x=>x.j===j&&x.b===b);
    if(!c||c.occ==null)return `<td class="nd" title="pas assez de relevés">·</td>`;
    const idx=Math.min(RAMP.length-1,Math.floor((c.occ-lo)/span*RAMP.length));
    const ink=idx>=3?"#0b0b0b":"#ffffff";
    return `<td style="background:var(${RAMP[idx]});color:${ink}" data-tip="${jn} ${bk[2]}|${c.occ}% occupé|${c.n} créneaux">${c.occ}</td>`;
  }).join("")+`</tr>`).join("");
  const table=`<table class="tv"><thead><tr><th>Jour</th>${BUCKETS.map(b=>`<th class="n">${b[2]}</th>`).join("")}</tr></thead><tbody>
    ${JOURS.map((jn,j)=>`<tr><td>${jn}</td>${BUCKETS.map((bk,b)=>{const c=cells.find(x=>x.j===j&&x.b===b);
      return `<td class="n">${c&&c.occ!=null?c.occ+" %":"—"}</td>`;}).join("")}</tr>`).join("")}</tbody></table>`;
  return card("Quand le marché se remplit","Occupation par jour de semaine et tranche horaire — plus c'est clair, plus c'est réservé.",
    `<div class="hm"><table><thead><tr><th class="row"></th>${BUCKETS.map(b=>`<th>${b[2]}</th>`).join("")}</tr></thead>
      <tbody>${body}</tbody></table></div>
     <div class="legend"><span>Occupation</span><span>${lo} %</span><span class="sw">${RAMP.map(r=>`<i style="background:var(${r})"></i>`).join("")}</span><span>${hi} %</span>
       <span style="margin-left:6px">· <i style="display:inline-block;width:10px;height:9px;border-radius:2px;background:var(--surface-2);border:1px solid var(--hair);vertical-align:middle"></i> trop peu de relevés</span></div>`,
    table,"hm");
}

/* Classement enseignes — UNE série -> UNE couleur (jamais un ramp sur du nominal) */
function cardRank(A){
  const rows=Object.entries(A.parEns).map(([id,v])=>({id,nom:(EN[id]||{}).nom||id,occ:pct(v.n-v.libres,v.n),n:v.n}))
    .filter(r=>r.n>=12).sort((a,b)=>b.occ-a.occ);
  const top=rows.slice(0,12);
  const body=top.map(r=>`<div class="row" onclick="openEns('${r.id}')" data-tip="${esc(r.nom)}|${r.occ}% occupé|${r.n} créneaux relevés">
      <span class="nm">${esc(r.nom)}</span><span class="track"><i style="width:${r.occ}%"></i></span><span class="pct">${r.occ}%</span></div>`).join("");
  const table=`<table class="tv"><thead><tr><th>Enseigne</th><th class="n">Occupation</th><th class="n">Créneaux</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.nom)}</td><td class="n">${r.occ} %</td><td class="n">${r.n}</td></tr>`).join("")}</tbody></table>`;
  return card("Enseignes les plus demandées",`Taux d'occupation, enseignes avec ≥12 créneaux relevés. Clique pour le détail.`,
    `<div class="rank">${body||'<div class="center">Pas assez de données sur ce filtre.</div>'}</div>`,table,"rk");
}

/* Positionnement prix × occupation — nuage, une série, labels sélectifs */
function cardScatter(A){
  const pts=Object.entries(A.parEns).map(([id,v])=>({id,nom:(EN[id]||{}).nom||id,
      occ:pct(v.n-v.libres,v.n),prix:median(v.prix),n:v.n}))
    .filter(p=>p.prix&&p.n>=12);
  if(pts.length<3)return card("Positionnement prix × demande","Prix médian d'une session face au taux d'occupation.",
    `<div class="center">Pas assez d'enseignes avec des prix publiés sur ce filtre.</div>`,"","sc");
  const W=520,Hh=260,P={l:44,r:16,t:12,b:34};
  const xs=pts.map(p=>p.prix), xmin=Math.min(...xs)*.92, xmax=Math.max(...xs)*1.06;
  const X=v=>P.l+(v-xmin)/(xmax-xmin)*(W-P.l-P.r), Y=v=>Hh-P.b-(v/100)*(Hh-P.t-P.b);
  const gy=[0,25,50,75,100], gx=[0,.25,.5,.75,1].map(f=>Math.round(xmin+f*(xmax-xmin)));
  const best=[...pts].sort((a,b)=>b.occ-a.occ)[0], pricey=[...pts].sort((a,b)=>b.prix-a.prix)[0];
  const svg=`<svg viewBox="0 0 ${W} ${Hh}" width="100%" height="${Hh}" role="img" aria-label="Nuage prix médian par session contre taux d'occupation">
    ${gy.map(g=>`<line x1="${P.l}" x2="${W-P.r}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--grid)" stroke-width="1"/>
       <text x="${P.l-8}" y="${Y(g)+4}" fill="var(--muted)" font-size="10" text-anchor="end">${g}%</text>`).join("")}
    ${gx.map(g=>`<text x="${X(g)}" y="${Hh-12}" fill="var(--muted)" font-size="10" text-anchor="middle">${g} €</text>`).join("")}
    <line x1="${P.l}" x2="${W-P.r}" y1="${Hh-P.b}" y2="${Hh-P.b}" stroke="var(--axis)" stroke-width="1"/>
    ${pts.map(p=>`<circle cx="${X(p.prix)}" cy="${Y(p.occ)}" r="6" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"
        data-tip="${esc(p.nom)}|${p.occ}% occupé · ${eur(p.prix)}|${p.n} créneaux"/>`).join("")}
    ${[best,pricey].filter((v,i,a)=>v&&a.indexOf(v)===i).map(p=>{
        const x=X(p.prix), right=x>(W-P.r)*0.62;          // label à gauche si trop près du bord
        return `<text x="${right?x-10:x+10}" y="${Math.max(14,Y(p.occ)+4)}" text-anchor="${right?"end":"start"}"
          fill="var(--ink-2)" font-size="11">${esc(p.nom.length>18?p.nom.slice(0,17)+"…":p.nom)}</text>`;}).join("")}
    <text x="${P.l}" y="10" fill="var(--muted)" font-size="10">occupation ↑</text></svg>`;
  const table=`<table class="tv"><thead><tr><th>Enseigne</th><th class="n">Prix médian</th><th class="n">Occupation</th></tr></thead><tbody>
    ${[...pts].sort((a,b)=>b.occ-a.occ).map(p=>`<tr><td>${esc(p.nom)}</td><td class="n">${eur(p.prix)}</td><td class="n">${p.occ} %</td></tr>`).join("")}</tbody></table>`;
  return card("Positionnement prix × demande","Chaque point = une enseigne. En haut à droite : cher et très demandé.",svg,table,"sc");
}

      <div class="r"><span class="k">Enseignes</span><span>${nE}</span></div>
      <div class="r"><span class="k">Centres</span><span>${nC}</span></div>
      <div class="r"><span class="k">Salles</span><span>${nS}</span></div>
      <div class="r"><span class="k">Créneaux chargés</span><span>${SESS.length.toLocaleString("fr-FR")}</span></div>
      <div class="r"><span class="k">Dernier relevé</span><span>${ago(FRESH)}</span></div></div>
    <div class="src"><h4>D'où viennent les données</h4>
      <div class="csub" style="line-height:1.6">Les disponibilités sont relevées automatiquement sur les
      <b>systèmes de réservation officiels</b> des enseignes (données publiques affichées au client),
      toutes les 30 minutes. Chaque fiche enseigne et salle indique sa source et l'heure du dernier relevé.</div></div>
    <div class="src"><h4>Comment lire l'occupation</h4>
      <div class="csub" style="line-height:1.6"><b>Occupation</b> = part des créneaux publiés qui ne sont
      plus réservables. Un créneau peut être indisponible parce qu'il est réservé <i>ou</i> parce que la salle
      est fermée sur ce créneau : l'indicateur mesure donc la <b>disponibilité commerciale</b>, une borne haute
      de la fréquentation réelle. Les cases de la heatmap avec moins de 3 relevés ne sont pas colorées.</div></div>
    <div class="src"><h4>Ce qui est volontairement écarté</h4>
      <div class="csub" style="line-height:1.6">
      • <b>${N_NOPUB} salles</b> n'ont jamais affiché le moindre créneau libre sur la période : elles ne
      publient pas leurs disponibilités (salle fermée, réservation par téléphone…). Les compter reviendrait à
      les afficher à « 100 % occupé », ce qui serait faux — elles sont donc <b>exclues des taux</b>.<br>
      • Le <b>dernier jour de l'horizon</b> n'est publié que partiellement par les enseignes ; il est écarté
      pour ne pas gonfler artificiellement l'occupation.</div></div>
    <div class="src"><h4>Prix</h4>
      <div class="csub" style="line-height:1.6">Prix <b>total d'une session</b> (pas par personne), moyenné sur les
      tailles de groupe proposées, tel que publié par l'enseigne. Les enseignes qui n'affichent pas leurs tarifs
      en ligne apparaissent sans prix.</div></div>`);
}

/* tooltips partagés (survol + focus) */
function wireHovers(){
  const tip=$("#tip");
  document.querySelectorAll("[data-tip]").forEach(el=>{
    el.onmouseenter=ev=>{const [a,b,c]=el.dataset.tip.split("|");
      tip.innerHTML=`<b>${a}</b>${b?`<div>${b}</div>`:""}${c?`<div class="m">${c}</div>`:""}`;
      tip.style.display="block";move(ev);};
    el.onmousemove=move;
    el.onmouseleave=()=>tip.style.display="none";
  });
  function move(ev){const t=$("#tip"),w=t.offsetWidth,h=t.offsetHeight;
    t.style.left=Math.min(ev.clientX+14,innerWidth-w-10)+"px";
    t.style.top=Math.max(8,ev.clientY-h-12)+"px";}
}

/* nav + filtres */
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{

document.querySelectorAll("#segper button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#segper button").forEach(x=>x.classList.toggle("on",x===b));
  PER=b.dataset.p;render();});
$("#fville").onchange=e=>{VILLE=e.target.value;render();};
