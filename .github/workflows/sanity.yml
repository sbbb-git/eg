name: sanity (freshness check)

# Surveille la collecte de bout en bout (Supabase + erreurs du scraper) toutes
# les ~3 h. Ouvre (ou complète) une issue GitHub en cas de problème, la referme
# quand tout est rétabli.
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restaurer le store (lecture seule)
        uses: actions/cache/restore@v4
        with:
          path: escape_data
          key: escape-data-${{ github.run_id }}
          restore-keys: |
            escape-data-

      - name: Run sanity check
        id: sanity
        run: |
          set +e
          python3 sanity_check.py --hours 8 | tee sanity.log; code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Open issue if stale
        if: steps.sanity.outputs.code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('sanity.log', 'utf8');
            const title = '⚠️ Observatoire Escape IDF — problème de collecte';
            const body = "La surveillance a détecté un problème de collecte.\n\n```\n" + log + "\n```";
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'stale-data' });
            if (issues.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues.data[0].number, body });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['stale-data'] });
            }

      - name: Refermer l'issue si tout est rétabli
        if: steps.sanity.outputs.code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'stale-data' });
            for (const i of issues.data) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, body: '✅ Collecte rétablie : plus aucun problème détecté.' });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed' });
            }
