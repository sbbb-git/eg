name: escape-extension (relevés continus)

# GitHub n'exécute qu'une fraction des crons planifiés (un run toutes les ~5 h
# pour un cron « */30 »). Ce job ne compte donc plus sur le cron pour la
# fréquence : il boucle lui-même (relevé complet toutes les 10 min) pendant
# ~5 h 30, en 3 blocs avec sauvegarde du store entre chaque. Le cron sert juste
# à mettre le run suivant en file d'attente (concurrency) : il démarre dès que
# celui-ci se termine, d'où une couverture quasi continue.
#
# Ce job est le SEUL à écrire le store (escape_data/) et les sessions Supabase :
# plus de course entre caches de workflows concurrents.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: escape-extension
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
  PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
  PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}

jobs:
  releves:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restaurer le store
        uses: actions/cache/restore@v4
        with:
          path: escape_data
          key: escape-data-${{ github.run_id }}
          restore-keys: escape-data-

      - name: Playwright (seulement si un proxy Bookeo est configuré)
        if: env.PROXY_SERVER != ''
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Relevés — bloc 1 (sync complet au premier tour)
        run: python3 escape_loop.py --minutes 105 --every 10 --full-first
        continue-on-error: true

      - name: Sauvegarder le store (1/3)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: escape_data
          key: escape-data-${{ github.run_id }}-1

      - name: Relevés — bloc 2
        run: python3 escape_loop.py --minutes 105 --every 10
        continue-on-error: true

      - name: Sauvegarder le store (2/3)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: escape_data
          key: escape-data-${{ github.run_id }}-2

      - name: Relevés — bloc 3
        run: python3 escape_loop.py --minutes 105 --every 10
        continue-on-error: true

      - name: Sauvegarder le store (3/3)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: escape_data
          key: escape-data-${{ github.run_id }}-3
